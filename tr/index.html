        <script>window.__PAGE__ = {"component":"portfolio/home","props":{"locale":"tr","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"projects":{"featured":[{"slug":"smart-lab-analysis","title":"ATL Smart Lab Analysis","tagline":"Karmaşık bir laboratuvar raporundan net bir anlayışa","tier":"featured","kind":"CASE STUDY / HEALTH AI","context":"Bitirme projesi · 3 kişilik ekip · Karabük Üniversitesi","year":"2026","status":null,"summary":"PDF laboratuvar raporlarını analiz eden bir web sistemi: tıbbi değerleri çıkarır, her birini normal aralığıyla karşılaştırıp sade bir dille açıklar, ardından Random Forest makine öğrenmesi modeliyle anemi olasılığını tahmin eder.","problem":"Kan tahlili raporları sayılar ve kısaltmalarla doludur; çoğu kişi doktora gitmeden sonuçlarının normal olup olmadığını anlayamaz. Amaç, raporu uzman olmayanlar için anlaşılır kılmak ve anemi belirtileri için erken uyarı vermekti.","solution":"Kullanıcının raporunu yüklediği bir panel: sistem değerleri otomatik çıkarır, tıbbi aralıklara göre renklendirir, yüksek veya düşük her değerin anlamını ve olası nedenlerini açıklar, ardından yapay zekâ tahminini gösterir ve analizi kullanıcının geçmişine kaydeder.","role":"Akademik danışman eşliğinde üç kişilik bir ekipte, web arayüzü ve veritabanından analiz servisi ile tahmin modelinin bağlanmasına kadar sistemi birlikte geliştirdik.","steps":[{"body":"Kullanıcı giriş yapar ve PDF dosyasını panele sürükleyip bırakır.","title":"Raporu yükle"},{"body":"pdfplumber metin tabanlı raporları, pytesseract (OCR) ise taranmış raporları okur.","title":"Değerleri çıkar"},{"body":"Her değer normal aralığıyla karşılaştırılır ve renklerle düşük, normal veya yüksek olarak işaretlenir.","title":"Aralıklarla karşılaştır"},{"body":"Random Forest modeli cinsiyet, hemoglobin, MCH, MCHC ve MCV değerlerini alır ve anemi var/yok şeklinde sınıflandırır.","title":"Yapay zekâ tahmini"},{"body":"Her değer için sade bir açıklama, gerektiğinde doktora başvurma önerisi ve kayıtlı bir geçmiş.","title":"Açıkla ve kaydet"}],"highlights":[{"label":"Test verisinde Random Forest doğruluğu","value":"98%"},{"label":"Tahminde kullanılan gösterge","value":"5"},{"label":"Metin ve taranmış raporlar","value":"PDF + OCR"}],"challenges":["Raporlar laboratuvardan laboratuvara farklı görünüyor; bu yüzden iki çıkarma yolu gerekti: doğrudan metin okuma ve taranmış görüntüler için OCR.","Bazı raporlarda değerler eksik; pipeline içindeki SimpleImputer, bir değer olmasa bile modelin çalışmasını sağlıyor.","Tıbbi bir sonucu sorumlulukla sunmak: sistem yorumun ön değerlendirme olduğunu belirtir ve teşhis koymak yerine doktora başvurmayı önerir."],"learned":"Bir makine öğrenmesi modelini gerçek bir web uygulamasına bağlamayı ve karmaşık veriyi uzman olmayan birine anlatan bir arayüz tasarlamayı öğrendim.","tech":["Python","scikit-learn","pdfplumber","Tesseract OCR","PHP","MySQL","JavaScript","Node.js"],"github_url":"https://github.com/asmaa21102/smart-lab-analysis-project-","live_url":"/live/smart-lab/","demo":"lab"},{"slug":"lost-and-found","title":"Lost & Found","tagline":"Kaybolan her eşya sahibine dönmeyi hak eder","tier":"featured","kind":"PRODUCT WALKTHROUGH","context":"Web platformu · Full-stack · Yapay zekâ","year":"2026","status":null,"summary":"Kayıp ve bulunan eşyaları fotoğraf ve konumla bildirmek için bir web platformu: yapay zekâ ile fotoğrafla arama, gerekçesini açıklayan akıllı eşleştirme, gizli sahiplik doğrulaması ve tam bir yönetici paneli. Üniversiteler, okullar, ofisler ve halka açık yerler için.","problem":"Halka açık bir yerde bir şey kaybolduğunda bilgiler gruplar ve mesajlar arasında dağılır; eşyayı bulan kişi sahibine nasıl ulaşacağını bilemez. Projenin ilk sürümü yalnızca kelimelerle eşleştiriyordu, arayüzü basitti ve API yetkisiz erişime açıktı.","solution":"Sürüm 2, oturum ve rollere sahip tek bir Node sunucusu: haritalı ve çok fotoğraflı bildirim formu, filtre ve sıralamalı listeleme, yerelde çalışan CLIP modeliyle fotoğrafla arama. Eşleştirme fotoğraf, kelime, kategori, renk, marka, yer ve tarihi gerekçeli bir benzerlik puanında birleştirir; ardından eşyayı bulan kişinin doğruladığı (değerli eşyalarda yönetici de) gizli bir iade talebi gelir.","role":"İlk sürümü (PHP + Express) kendim geliştirdim: arayüzler, API, veritabanı ve eşleştirme algoritması. Sürüm 2 — yeni tasarım, fotoğrafla arama, talepler, yönetici paneli ve testler — bir yapay zekâ kodlama asistanıyla geliştirildi.","steps":[{"body":"En fazla 6 fotoğraf; yapay zekâ fotoğraftan kategori ve renk önerir; yer haritada seçilir. Yalnızca bildiren kişinin gördüğü gizli ayrıntılar.","title":"Bir dakikada bildirim"},{"body":"Bir fotoğraf yükleyin, bildirimler görsel benzerliğe göre sıralanır (transformers.js ile CLIP, API anahtarı gerekmez).","title":"Fotoğrafla arama"},{"body":"0–95 arası puan ve gerekçeleri: fotoğraf, kategori, kelimeler, renk, marka, mesafe ve tarih — her zaman bir öneri, asla bir onay değil.","title":"Kendini açıklayan eşleştirme"},{"body":"Gizli cevaplarla sahiplik talebi → inceleme → onay → iade; gizli mesajlar, her adımın geçmişi ve anlaşmazlıklarda yönetici incelemesi.","title":"Güvenli iade"}],"highlights":[{"label":"Yerelde fotoğrafla arama ve kategori/renk önerisi","value":"AI"},{"label":"Eşleşme puanında her biri açıklanan sinyal","value":"7"},{"label":"Eşleştirme ve kullanıcı akışları için otomatik test","value":"22"}],"challenges":["Fotoğraf benzerliğini ayarlamak: farklı nesnelerin CLIP puanları benzer nesnelerinkiyle örtüşüyor; bu yüzden demo fotoğraflarında ölçtüm ve benzerliği yanıltıcı bir yüzde yerine etiket olarak (çok benzer / benzer) gösterdim.","Gizlilik: herkese açık harita yaklaşık ~300 m bir alan gösterir, fotoğraflardaki konum verisi silinir, e-posta ve telefon asla gösterilmez, numara veya bağlantı içeren bildirimler incelemeyi bekler.","API'yi korumak: role dayalı yetkiler, CSRF koruması, istek sınırları ve dosya uzantısına güvenmek yerine görüntünün gerçek içeriğini kontrol etmek."],"learned":"Bir yapay zekâ modelini gerçek bir üründe dürüstçe — kararı insanların verdiği bir öneri olarak — kullanmayı ve roller, yetkiler ve denetim kaydı olan bir iş akışı tasarlamayı öğrendim.","tech":["Node.js","Express","MySQL","CLIP (transformers.js)","JavaScript","Leaflet","sharp","bcrypt"],"github_url":"https://github.com/asmaa21102/lost-found-project","live_url":"/live/lost-found/","demo":"match"},{"slug":"bereket-charity","title":"Bereket — bağış platformu","tagline":"Tek dokunuşla bağışla, bağışını ulaşana kadar izle","tier":"featured","kind":"FULL-STACK PRODUCT","context":"Web uygulaması · Laravel API + React","year":"2026","status":null,"summary":"Üç tarafı olan demo bir yardım platformu: bağışçılar tek dokunuşla bağış yapar, anında makbuz alır ve paralarının nereye gittiğini görür; yararlanıcılar şifreli belgelerle yardım talep edip durumu izler; yönetim ise kampanyaları, bağışları, mali raporları, gönüllüleri ve denetim kaydını yönetir. Üç dilde (Arapça, İngilizce, Türkçe) ve Türk lirasıyla.","problem":"Bağışçılar bağışlarının nereye gittiğini çoğu zaman bilmez; dernekler kampanyaları, zekâtı, sadakayı ve yardım taleplerini dağınık tablolarda yönetir; ailelerin hassas belgeleri (kimlik, sağlık raporu) güvensiz yollarla gönderilir.","solution":"Laravel REST API ve ayrı bir React uygulaması. Hızlı bağış, bağış sepeti, düzenli bağış ve hediye kartıyla birisi adına bağış, zekât hesaplayıcı, türüne göre ayrılan fonlar (zekât, sadaka, sadaka-i cariye, kefaret), saha güncellemeleriyle beslenen “paranız nereye gitti” zaman çizelgesi, rozetler ve bağışla büyüyen bir “iyilik ağacı”.","role":"Bir yapay zekâ kodlama asistanıyla geliştirdiğim bireysel proje: fikri ve gereksinimleri belirledim, teknolojileri seçtim, sonucu inceleyip test ettim. Ödemeler simülasyondur (test kartları) ve dernek hayalîdir — gerçek para toplanmaz.","steps":[{"body":"Hazır tutarlar, tutarın neler sağladığını gösteren etki kaydırıcısı (“2 gıda kolisi sağlar”), canlı kampanya ilerlemesi, ardından konfetili teşekkür ekranı ve paylaşım.","title":"Tek dokunuşla bağış"},{"body":"Anında yazdırılabilir dijital makbuz, tüm makbuzların ve düzenli bağışların olduğu bağış cüzdanı, alındı → satın alındı → teslim edildi zaman çizelgesi.","title":"Makbuz ve takip"},{"body":"Yararlanıcının yüklediği belgeler kaydedilmeden önce AES-256 ile şifrelenir; talep durumu izlenir: gönderildi, inceleniyor, onaylandı, ödendi.","title":"Güvenli yardım talebi"},{"body":"Üç dilde kampanyalar, CSV dışa aktarmalı bağışlar, fon bazında mali rapor, talep inceleme, gönüllüler ve görevler, roller ve yetkiler, denetim kaydı.","title":"Yönetim ve raporlar"}],"highlights":[{"label":"Taraf: bağışçı, yararlanıcı, yönetim","value":"3"},{"label":"Belgeler ve hassas veriler için şifreleme","value":"AES-256"},{"label":"Ödeme, şifreleme ve yetkiler için otomatik test","value":"22"}],"challenges":["Zekât ve kefaret kısıtlı fonlardır: her bağış türünü taşır, her kampanya belirli türleri kabul eder ve mali rapor her fonun giriş-çıkışını gösterir; böylece hiçbir şey amacı dışında harcanmaz.","Gizlilik: kart numarası asla saklanmaz (yalnızca tür ve son 4 hane), yararlanıcı belgeleri şifrelidir ve yalnızca sahibi ve personel açabilir; her görüntüleme kaydedilir.","Güvenlik: role dayalı yetkiler, personel için iki adımlı doğrulama (TOTP), giriş denemeleri için ayrı hız sınırları ve formül enjeksiyonuna karşı korunan CSV dışa aktarımları."],"learned":"Farklı ihtiyaçları olan birden çok taraf için ürün tasarlamak; ve bir yardım platformuna güvenin şeffaflıkla kurulduğu: her bağışa makbuz, sahadan güncellemeler ve fonların net ayrımı.","tech":["Laravel 12","PHP","REST API","Sanctum","MySQL","React","TypeScript","Tailwind CSS","Framer Motion","Recharts"],"github_url":null,"live_url":"/live/bereket/","demo":"give"}],"story":[{"slug":"layoffs-data-cleaning","title":"Layoffs Data Cleaning","tagline":"Dağınık veriden güvenilir bir tabloya","tier":"story","kind":"DATA STORYTELLING","context":"Veri analizi · MySQL","year":"2026","status":null,"summary":"Dünya genelindeki teknoloji şirketlerindeki işten çıkarmalara ait veri setini (2.300'den fazla kayıt) yalnızca SQL ile, adım adım analize hazır hale getirmek.","problem":"Ham veride tekrar eden satırlar, tutarsız adlar (Crypto ve CryptoCurrency), sonunda nokta olan ülkeler, metin olarak saklanan tarihler ve boş değerler vardı. Bu veriyle yapılan her analiz yanlış sonuç verirdi.","solution":"Orijinal veriyi korumak için bir ara kopya (staging) üzerinde çalışmak; ardından ayrı SQL dosyalarında belgelenmiş dört temizleme aşaması.","role":"SQL ve veri temizleme pratiği için bireysel bir proje.","steps":[{"body":"Tekrar eden satırları bulup silmek için CTE içinde ROW_NUMBER() OVER (PARTITION BY ...).","title":"Tekrarları sil"},{"body":"Şirket adlarına TRIM, Crypto ile başlayan her şeyi birleştirme ve ülke adlarındaki fazladan noktayı silme.","title":"Değerleri standartlaştır"},{"body":"Metni tarihe çevirmek için STR_TO_DATE, ardından sütun tipini DATE yapma.","title":"Tarihleri düzelt"},{"body":"Boş değerleri NULL'a çevirme, ardından eksik sektörü self join ile aynı şirketin diğer kayıtlarından doldurma.","title":"Boşlukları işle"}],"highlights":[{"label":"Ham verideki kayıt","value":"2,361"},{"label":"Belgelenmiş temizleme aşaması","value":"4"},{"label":"Harici araç olmadan SQL","value":"100%"}],"challenges":["Benzersiz bir kimlik sütunu yok; bu yüzden tekrarın tüm sütun kümesiyle tanımlanması gerekti.","Eksik değerleri tahmin etmeden doldurmak: yalnızca aynı şehirdeki aynı şirketin diğer kayıtlarından."],"learned":"İyi analiz iyi veriyle başlar; her adımı belgelemek çalışmayı incelenebilir kılar.","tech":["MySQL","SQL","CTE","Window Functions","Data Cleaning"],"github_url":"https://github.com/asmaa21102/Data-Cleaning-MySQL","live_url":null,"demo":"data"},{"slug":"tech-jobs-turkey","title":"Türkiye’de teknoloji işlerine talep","tagline":"Teknoloji iş ilanları mezundan ne istiyor?","tier":"story","kind":"DATA RESEARCH","context":"“Profesyonelce Claude ve araştırma tasarımı” kursunun bitirme projesi","year":"2026","status":null,"summary":"LinkedIn’deki 252 Türkiye teknoloji ilanını inceleyen bir araştırma: talep hangi iş ailelerinden ve şehirlerden geliyor, hangi deneyim, eğitim, dil ve araçlar isteniyor, ilanların dili adaya nasıl sesleniyor. Öneriler içeren kapsamlı bir analiz raporuyla sonuçlandı.","problem":"Öğrenci diplomasıyla mezun oluyor, ardından deneyim, mesleki sertifika, dil ve belirli araçlar isteyen ilanlarla karşılaşıyor; her teknoloji alanında piyasanın gerçekte ne istediğine dair net bir tablo yok.","solution":"Dört şehirde Türkçe ve İngilizce yirmi unvanla LinkedIn ilanları toplandı, belgelenmiş adımlarla temizlendi, 14 eksende 89 gösterge otomatik kodlandı ve 20 ilan açıklaması nitel olarak incelendi. Rapor bulguyu, çıkarımı ve öneriyi ayırıyor.","role":"Araştırma sorusunu oluşturmak ve geliştirmek, veriyi toplamak ve temizlemek, Python ile nicel ve nitel analiz, grafikleri tasarlamak ve raporu yazmak.","steps":[{"body":"Üç partide 263 LinkedIn ilanı; her partide yalnızca yeniler eklendi.","title":"Toplama"},{"body":"Bir kayıtta belgelenen sekiz adım: tekrar yayınlar ve serbest çalışma platformları çıkarıldı, şüpheliler silinmek yerine işaretlendi. 252 ilan kaldı.","title":"Temizlik"},{"body":"Türkçe ve İngilizce anahtar kelimelerle 14 eksen ve 89 göstergeli kılavuz (eğitim, programlama dilleri, bulut, ağlar, sertifikalar…).","title":"Nicel kodlama"},{"body":"20 ilan açıklamasından 592 bölüm, 6 temada 26 kodla kodlandı; kodlayıcılar arası güvenilirlik testi için bir dosya hazırlandı.","title":"Nitel analiz"},{"body":"On bir grafik, hipotez hakkında bir hüküm, her bulgu için kesinlik düzeyi ve uygulama haritalı öneriler içeren bir rapor.","title":"Rapor"}],"highlights":[{"label":"temizlik sonrası teknoloji ilanı","value":"252"},{"label":"kodlama kılavuz
