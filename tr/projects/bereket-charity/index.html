        <script>window.__PAGE__ = {"component":"portfolio/project","props":{"locale":"tr","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"project":{"slug":"bereket-charity","title":"Bereket — bağış platformu","tagline":"Tek dokunuşla bağışla, bağışını ulaşana kadar izle","tier":"featured","kind":"FULL-STACK PRODUCT","context":"Web uygulaması · Laravel API + React","year":"2026","status":null,"summary":"Üç tarafı olan demo bir yardım platformu: bağışçılar tek dokunuşla bağış yapar, anında makbuz alır ve paralarının nereye gittiğini görür; yararlanıcılar şifreli belgelerle yardım talep edip durumu izler; yönetim ise kampanyaları, bağışları, mali raporları, gönüllüleri ve denetim kaydını yönetir. Üç dilde (Arapça, İngilizce, Türkçe) ve Türk lirasıyla.","problem":"Bağışçılar bağışlarının nereye gittiğini çoğu zaman bilmez; dernekler kampanyaları, zekâtı, sadakayı ve yardım taleplerini dağınık tablolarda yönetir; ailelerin hassas belgeleri (kimlik, sağlık raporu) güvensiz yollarla gönderilir.","solution":"Laravel REST API ve ayrı bir React uygulaması. Hızlı bağış, bağış sepeti, düzenli bağış ve hediye kartıyla birisi adına bağış, zekât hesaplayıcı, türüne göre ayrılan fonlar (zekât, sadaka, sadaka-i cariye, kefaret), saha güncellemeleriyle beslenen “paranız nereye gitti” zaman çizelgesi, rozetler ve bağışla büyüyen bir “iyilik ağacı”.","role":"Bir yapay zekâ kodlama asistanıyla geliştirdiğim bireysel proje: fikri ve gereksinimleri belirledim, teknolojileri seçtim, sonucu inceleyip test ettim. Ödemeler simülasyondur (test kartları) ve dernek hayalîdir — gerçek para toplanmaz.","steps":[{"body":"Hazır tutarlar, tutarın neler sağladığını gösteren etki kaydırıcısı (“2 gıda kolisi sağlar”), canlı kampanya ilerlemesi, ardından konfetili teşekkür ekranı ve paylaşım.","title":"Tek dokunuşla bağış"},{"body":"Anında yazdırılabilir dijital makbuz, tüm makbuzların ve düzenli bağışların olduğu bağış cüzdanı, alındı → satın alındı → teslim edildi zaman çizelgesi.","title":"Makbuz ve takip"},{"body":"Yararlanıcının yüklediği belgeler kaydedilmeden önce AES-256 ile şifrelenir; talep durumu izlenir: gönderildi, inceleniyor, onaylandı, ödendi.","title":"Güvenli yardım talebi"},{"body":"Üç dilde kampanyalar, CSV dışa aktarmalı bağışlar, fon bazında mali rapor, talep inceleme, gönüllüler ve görevler, roller ve yetkiler, denetim kaydı.","title":"Yönetim ve raporlar"}],"highlights":[{"label":"Taraf: bağışçı, yararlanıcı, yönetim","value":"3"},{"label":"Belgeler ve hassas veriler için şifreleme","value":"AES-256"},{"label":"Ödeme, şifreleme ve yetkiler için otomatik test","value":"22"}],"challenges":["Zekât ve kefaret kısıtlı fonlardır: her bağış türünü taşır, her kampanya belirli türleri kabul eder ve mali rapor her fonun giriş-çıkışını gösterir; böylece hiçbir şey amacı dışında harcanmaz.","Gizlilik: kart numarası asla saklanmaz (yalnızca tür ve son 4 hane), yararlanıcı belgeleri şifrelidir ve yalnızca sahibi ve personel açabilir; her görüntüleme kaydedilir.","Güvenlik: role dayalı yetkiler, personel için iki adımlı doğrulama (TOTP), giriş denemeleri için ayrı hız sınırları ve formül enjeksiyonuna karşı korunan CSV dışa aktarımları."],"learned":"Farklı ihtiyaçları olan birden çok taraf için ürün tasarlamak; ve bir yardım platformuna güvenin şeffaflıkla kurulduğu: her bağışa makbuz, sahadan güncellemeler ve fonların net ayrımı.","tech":["Laravel 12","PHP","REST API","Sanctum","MySQL","React","TypeScript","Tailwind CSS","Framer Motion","Recharts"],"github_url":null,"live_url":"/live/bereket/","demo":"give"},"next":{"slug":"layoffs-data-cleaning","title":"Layoffs Data Cleaning","tagline":"Dağınık veriden güvenilir bir tabloya"}},"prefix":"/tr","path":"/projects/bereket-charity/"};</script>
