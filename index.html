        <script>window.__PAGE__ = {"component":"portfolio/home","props":{"locale":"ar","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"projects":{"featured":[{"slug":"smart-lab-analysis","title":"ATL Smart Lab Analysis","tagline":"من تقرير مختبر معقّد إلى فهم واضح","tier":"featured","kind":"CASE STUDY / HEALTH AI","context":"مشروع التخرج · فريق من 3 طلاب · جامعة كارابوك","year":"2026","status":null,"summary":"نظام ويب يحلّل تقارير المختبر بصيغة PDF: يستخرج القيم الطبية، يقارن كل قيمة بالمعدل الطبيعي ويشرحها بلغة بسيطة، ثم يستخدم نموذج تعلّم آلة من نوع Random Forest لتقدير احتمال فقر الدم.","problem":"تقارير تحليل الدم مليئة بالأرقام والاختصارات، وأغلب الناس لا يعرفون إذا كانت نتائجهم طبيعية أم لا حتى يراجعوا الطبيب. الهدف كان جعل التقرير مفهومًا لغير المختصين، مع تنبيه مبكر لمؤشرات فقر الدم.","solution":"لوحة تحكم يرفع فيها المستخدم تقريره، فيستخرج النظام القيم تلقائيًا، ويصنّفها بالألوان حسب المعدلات الطبية، ويشرح معنى كل قيمة مرتفعة أو منخفضة وأسبابها المحتملة، ثم يعرض نتيجة نموذج الذكاء الاصطناعي ويحفظ التحليل في سجل المستخدم.","role":"عملتُ ضمن فريق من ثلاثة طلاب بإشراف أكاديمي، على بناء النظام من واجهة الويب وقاعدة البيانات حتى ربط خدمة التحليل ونموذج التنبؤ.","steps":[{"body":"المستخدم يسجّل دخوله ويرفع ملف PDF من لوحة التحكم بالسحب والإفلات.","title":"رفع التقرير"},{"body":"pdfplumber يقرأ التقارير النصية، وpytesseract (OCR) يتعامل مع التقارير الممسوحة ضوئيًا.","title":"استخراج القيم"},{"body":"كل قيمة تُقارن بمداها الطبيعي وتُصنَّف: منخفضة، طبيعية أو مرتفعة، بألوان واضحة.","title":"المقارنة بالمعدلات"},{"body":"نموذج Random Forest يأخذ الجنس والهيموغلوبين وMCH وMCHC وMCV، ويصنّف النتيجة: فقر دم أو لا.","title":"تنبؤ الذكاء الاصطناعي"},{"body":"شرح بسيط لكل قيمة مع توصية بمراجعة الطبيب عند الحاجة، وحفظ التحليل في سجل يمكن الرجوع إليه.","title":"الشرح والسجل"}],"highlights":[{"label":"دقة نموذج Random Forest على بيانات الاختبار","value":"98%"},{"label":"مؤشرات يعتمد عليها التنبؤ","value":"5"},{"label":"تقارير نصية وممسوحة ضوئيًا","value":"PDF + OCR"}],"challenges":["التقارير تختلف في شكلها من مختبر لآخر، فاحتجنا مسارين للاستخراج: قراءة نصية مباشرة، وOCR للصور الممسوحة.","بعض التقارير لا تحتوي كل القيم، فوضعنا SimpleImputer داخل الـ Pipeline حتى يعمل النموذج حتى لو غابت قيمة.","عرض نتيجة طبية بمسؤولية: النظام يوضّح أن التفسير أولي، وينصح بزيارة الطبيب بدل أن يقدّم تشخيصًا."],"learned":"كيف أربط نموذج تعلّم آلة بتطبيق ويب حقيقي، وكيف أصمّم واجهة تشرح بيانات معقّدة لشخص غير مختص.","tech":["Python","scikit-learn","pdfplumber","Tesseract OCR","PHP","MySQL","JavaScript","Node.js"],"github_url":"https://github.com/asmaa21102/smart-lab-analysis-project-","live_url":null,"demo":"lab"},{"slug":"lost-and-found","title":"Lost & Found","tagline":"كل غرض ضائع يستحق طريقًا يرجع فيه لصاحبه","tier":"featured","kind":"PRODUCT WALKTHROUGH","context":"تطبيق ويب · Full-stack","year":"2026","status":null,"summary":"منصّة ويب لتسجيل الأغراض المفقودة والموجودة بالصور والموقع، فيها بحث بالصورة بالذكاء الاصطناعي، ومطابقة ذكية تشرح أسبابها، وطلبات استرجاع بتحقّق خاص، ولوحة إدارة كاملة. تناسب الجامعات والمدارس والمكاتب والأماكن العامة.","problem":"عندما يضيع غرض في مكان عام، تتشتت المعلومات بين مجموعات ورسائل، ومن يجد الغرض لا يعرف كيف يصل لصاحبه. والنسخة الأولى من المشروع كانت تطابق بالكلمات فقط، وواجهتها بسيطة، والـ API فيه مفتوح بلا صلاحيات.","solution":"النسخة الثانية خادم Node واحد بجلسات وصلاحيات. فيها نموذج بلاغ بعدّة صور وخريطة، وتصفّح بفلاتر وترتيب، وبحث بالصورة عن طريق نموذج CLIP يعمل محليًا. المطابقة تجمع الصورة والكلمات والفئة واللون والماركة والمكان والتاريخ في درجة تشابه مع أسبابها، ثم طلب استرجاع خاص يتحقق فيه من وجد الغرض (والأدمن في الأغراض الثمينة).","role":"النسخة الأولى (PHP + Express) بنيتها بنفسي: الواجهات والـ API وقاعدة البيانات وخوارزمية المطابقة. النسخة الثانية طوّرتها بمساعدة مساعد برمجة بالذكاء الاصطناعي: إعادة التصميم، والبحث بالصورة، والطلبات، ولوحة الإدارة، والاختبارات.","steps":[{"body":"حتى 6 صور، ويقترح الذكاء الاصطناعي الفئة واللون من الصورة، والمكان يُحدَّد على الخريطة. وتفاصيل خاصة لا يراها إلا صاحب البلاغ.","title":"بلاغ في دقيقة"},{"body":"ترفع صورة فيرتّب النظام البلاغات حسب التشابه البصري (CLIP عبر transformers.js، بدون مفتاح API).","title":"بحث بالصورة"},{"body":"درجة من 0 إلى 95 مع الأسباب: الصورة، والفئة، والكلمات، واللون، والماركة، والمسافة، والتاريخ. وهي اقتراح فقط، لا تأكيد.","title":"مطابقة تشرح نفسها"},{"body":"طلب ملكية بإجابات خاصة، ثم مراجعة، ثم موافقة، ثم إرجاع، مع رسائل خاصة وسجل لكل خطوة ولوحة أدمن للنزاعات.","title":"استرجاع آمن"}],"highlights":[{"label":"بحث بالصورة واقتراح الفئة واللون محليًا","value":"AI"},{"label":"إشارات في درجة المطابقة مع شرح الأسباب","value":"7"},{"label":"اختبارًا آليًا للمطابقة ورحلات المستخدم","value":"22"}],"challenges":["معايرة تشابه الصور: درجات CLIP لأغراض مختلفة تتداخل مع درجات أغراض متشابهة، فقِستُها على صور العرض، وصار التشابه يظهر كوصف (مشابه جدًا / مشابه) بدل نسبة مضلِّلة.","الخصوصية: الخريطة العامة تُظهر منطقة تقريبية (~300 م)، وتُحذف بيانات الموقع من الصور، ولا يظهر الإيميل أو الهاتف، والبلاغات التي فيها أرقام أو روابط تنتظر المراجعة.","حماية الـ API: صلاحيات حسب الدور، وحماية CSRF، وحدود لعدد الطلبات، وفحص محتوى الصور الحقيقي بدل الاعتماد على الامتداد."],"learned":"استخدام نموذج ذكاء اصطناعي داخل منتج حقيقي بشكل صادق، يعني كاقتراح يقرّر فيه الإنسان، وتصميم سير عمل فيه أدوار وصلاحيات وسجل تدقيق.","tech":["Node.js","Express","MySQL","CLIP (transformers.js)","JavaScript","Leaflet","sharp","bcrypt"],"github_url":"https://github.com/asmaa21102/lost-found-project","live_url":"/live/lost-found/","demo":"match"},{"slug":"bereket-charity","title":"Bereket — منصة تبرعات","tagline":"تبرّع بلمسة، وتابع أثر تبرعك حتى يصل","tier":"featured","kind":"FULL-STACK PRODUCT","context":"تطبيق ويب · Laravel API + React","year":"2026","status":null,"summary":"منصة خيرية تجريبية بثلاث واجهات: متبرع يتبرع بلمسة ويحصل على إيصال فوري ويتابع أين ذهبت أمواله، ومستفيد يقدّم طلب مساعدة بمستندات مشفّرة ويتابع حالته، وإدارة للحملات والتبرعات والتقارير المالية والمتطوعين وسجل التدقيق. بثلاث لغات (عربي، إنجليزي، تركي) وبالليرة التركية.","problem":"المتبرع غالبًا لا يعرف أين ذهب تبرعه، والجمعيات تدير الحملات والزكاة والصدقات وطلبات المساعدة في جداول متفرقة، والمستندات الحساسة للأسر (الهوية، التقارير الطبية) تُرسل بطرق غير آمنة.","solution":"واجهة REST بـ Laravel وتطبيق React منفصل. تبرع سريع وسلة تبرعات وتبرع دوري وتبرع نيابةً عن شخص مع بطاقة إهداء، وحاسبة زكاة، وفصل الأموال حسب نوعها (زكاة، صدقة، صدقة جارية، كفارة)، وخط زمني «أين ذهب تبرعك» تغذّيه تحديثات الميدان، وشارات و«شجرة خير» تكبر مع العطاء.","role":"مشروع فردي بنيته بمساعدة مساعد برمجة بالذكاء الاصطناعي: حدّدت الفكرة والمتطلبات واخترت التقنيات وراجعت النتائج واختبرتها. الدفع تجريبي (بطاقات اختبار) والجمعية افتراضية — لا يُجمع أي مال حقيقي.","steps":[{"body":"مبالغ جاهزة، وشريط أثر يوضّح ما يوفّره المبلغ («يوفّر سلتين غذائيتين»)، وتقدّم الحملة يتحرك مباشرة، ثم شاشة شكر واحتفال ومشاركة.","title":"تبرع بلمسة"},{"body":"إيصال رقمي فوري قابل للطباعة، ومحفظة عطاء فيها كل الإيصالات والتبرعات الدورية، وخط زمني من الاستلام إلى الشراء والتسليم.","title":"إيصال وتتبّع"},{"body":"المستفيد يرفع مستنداته فتُشفَّر بـ AES-256 قبل حفظها، ويتابع حالة طلبه: إرسال، دراسة، موافقة، صرف.","title":"طلب مساعدة آمن"},{"body":"حملات بثلاث لغات، تبرعات مع تصدير CSV، تقرير مالي لكل صندوق، مراجعة الطلبات، متطوعون ومهام، أدوار وصلاحيات، وسجل تدقيق.","title":"إدارة وتقارير"}],"highlights":[{"label":"واجهات: متبرع، مستفيد، إدارة","value":"3"},{"label":"تشفير المستندات والبيانات الحساسة","value":"AES-256"},{"label":"اختبارًا آليًا للدفع والتشفير والصلاحيات","value":"22"}],"challenges":["أموال الزكاة والكفارة مقيّدة: كل تبرع يحمل نوعه، وكل حملة تقبل أنواعًا محددة، والتقرير المالي يعرض الوارد والصادر لكل صندوق حتى لا تُصرف في غير بابها.","الخصوصية: لا يُخزَّن رقم البطاقة أبدًا (فقط النوع وآخر 4 أرقام)، ومستندات المستفيدين مشفّرة ولا يفتحها إلا صاحبها والموظفون، وكل فتح يُسجَّل.","الأمان: صلاحيات حسب الدور، وتحقق بخطوتين (TOTP) للموظفين، وحدود منفصلة لعدد محاولات الدخول، وحماية ملفات CSV من حقن الصيغ."],"learned":"تصميم منتج فيه أطراف مختلفة باحتياجات مختلفة، وأن الثقة في منصة خيرية تُبنى بالشفافية: إيصال لكل تبرع، وتحديثات من الميدان، وفصل واضح بين الأموال.","tech":["Laravel 12","PHP","REST API","Sanctum","MySQL","React","TypeScript","Tailwind CSS","Framer Motion","Recharts"],"github_url":null,"live_url":null,"demo":"give"}],"story":[{"slug":"layoffs-data-cleaning","title":"Layoffs Data Cleaning","tagline":"من بيانات فوضوية إلى جدول يمكن الوثوق به","tier":"story","kind":"DATA STORYTELLING","context":"تحليل بيانات · MySQL","year":"2026","status":null,"summary":"تنظيف بيانات تسريح الموظفين في شركات التكنولوجيا حول العالم (أكثر من 2,300 سجل) باستخدام SQL فقط، خطوة بخطوة، حتى تصبح جاهزة للتحليل.","problem":"البيانات الخام فيها صفوف مكررة، أسماء غير موحّدة (Crypto وCryptocurrency)، دول بنقطة زائدة، تواريخ مخزّنة كنص، وقيم فارغة. أي تحليل عليها كان سيعطي أرقامًا خاطئة.","solution":"العمل على نسخة مرحلية (staging) لحماية البيانات الأصلية، ثم أربع مراحل تنظيف موثّقة في ملفات SQL منفصلة.","role":"مشروع فردي لتطبيق مهارات SQL وتنظيف البيانات.","steps":[{"body":"ROW_NUMBER() OVER (PARTITION BY ...) داخل CTE لاكتشاف الصفوف المكررة وحذفها.","title":"إزالة التكرار"},{"body":"TRIM لأسماء الشركات، توحيد كل ما يبدأ بـ Crypto، وإزالة النقطة الزائدة من أسماء الدول.","title":"توحيد القيم"},{"body":"STR_TO_DATE لتحويل النص إلى تاريخ، ثم تغيير نوع العمود إلى DATE.","title":"إصلاح التواريخ"},{"body":"تحويل القيم الفارغة إلى NULL، ثم تعبئة الصناعة الناقصة من سجلات نفس الشركة باستخدام Self Join.","title":"معالجة الفراغات"}],"highlights":[{"label":"سجل في البيانات الخام","value":"2,361"},{"label":"مراحل تنظيف موثّقة","value":"4"},{"label":"SQL بدون أدوات خارجية","value":"100%"}],"challenges":["لا يوجد عمود معرّف فريد، فكان لازم تعريف التكرار بمجموعة أعمدة كاملة.","تعبئة القيم الناقصة بدون تخمين: فقط من سجلات أخرى لنفس الشركة ونفس المدينة."],"learned":"أن جودة التحليل تبدأ من جودة البيانات، وأن توثيق كل خطوة يجعل العمل قابلًا للمراجعة.","tech":["MySQL","SQL","CTE","Window Functions","Data Cleaning"],"github_url":"https://github.com/asmaa21102/Data-Cleaning-MySQL","live_url":null,"demo":"data"},{"slug":"tech-jobs-turkey","title":"الطلب على الوظائف التقنية في تركيا","tagline":"ماذا تطلب إعلانات الوظائف التقنية من الخريج؟","tier":"story","kind":"DATA RESEARCH","context":"المشروع النهائي لدورة «Claude باحتراف وتصميم البحث»","year":"2026","status":null,"summary":"بحث يحلل 252 إعلانًا لوظائف تقنية في تركيا على LinkedIn: من أي عائلات الوظائف والمدن يأتي الطلب، وما الخبرة والتعليم واللغة والأدوات المطلوبة، وكيف تخاطب لغة الإعلانات المتقدّم. انتهى بتقرير تحليلي كامل بتوصيات.","problem":"يتخرج الطالب بشهادة، ثم يجد إعلانات تطلب خبرة وشهادات مهنية ولغة وأدوات بعينها، دون صورة واضحة عمّا يطلبه السوق فعلًا في كل تخصص تقني.","solution":"جمع إعلانات LinkedIn بعشرين مسمى وظيفيًا بالتركية والإنجليزية في أربع مدن، ثم تنظيفها بخطوات موثّقة، ثم رصد 89 مؤشرًا في 14 محورًا آليًا، وتحليل نوعي لأوصاف 20 إعلانًا، وكتابة تقرير يفصل بين النتيجة والاستنتاج والتوصية.","role":"صياغة سؤال البحث وتطويره، وجمع البيانات وتنظيفها، والتحليل الكمي والنوعي بـ Python، وتصميم الأشكال وكتابة التقرير.","steps":[{"body":"263 إعلانًا من LinkedIn في ثلاث دفعات، مع حفظ الجديد فقط في كل دفعة.","title":"الجمع"},{"body":"ثماني خطوات موثّقة في سجل: حذف إعادة النشر ومنصات العمل الحر، ووسم المشكوك فيه بدل حذفه. بقي 252 إعلانًا.","title":"التنظيف"},{"body":"دليل من 14 محورًا و89 مؤشرًا (التعليم، لغات البرمجة، السحابة، الشبكات، الشهادات…) بكلمات دالة بالتركية والإنجليزية.","title":"الرصد الكمي"},{"body":"592 مقطعًا من أوصاف 20 إعلانًا رُمّزت بـ 26 رمزًا في 6 موضوعات، مع ملف لاختبار الثبات بين مرمّزين.","title":"التحليل النوعي"},{"body":"تقرير بأحد عشر شكلًا، وحكم على الفرضية، ودرجة يقين لكل نتيجة، وتوصيات بخارطة تطبيق.","title":"التقرير"}],"highlights":[{"label":"إعلانًا تقنيًا بعد التنظيف","value":"252"},{"label":"مؤشرًا في دليل الرصد","value":"89"},{"label":"من الإعلانات بلغت 200 متقدم","value":"79.7%"}],"challenges":["تغيّر تصميم البحث مرتين، فأُرشف كل تص
