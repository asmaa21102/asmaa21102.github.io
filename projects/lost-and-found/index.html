        <script>window.__PAGE__ = {"component":"portfolio/project","props":{"locale":"ar","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"project":{"slug":"lost-and-found","title":"Lost & Found","tagline":"كل غرض ضائع يستحق طريقًا يرجع فيه لصاحبه","tier":"featured","kind":"PRODUCT WALKTHROUGH","context":"تطبيق ويب · Full-stack","year":"2026","status":null,"summary":"منصّة ويب لتسجيل الأغراض المفقودة والموجودة بالصور والموقع، فيها بحث بالصورة بالذكاء الاصطناعي، ومطابقة ذكية تشرح أسبابها، وطلبات استرجاع بتحقّق خاص، ولوحة إدارة كاملة. تناسب الجامعات والمدارس والمكاتب والأماكن العامة.","problem":"عندما يضيع غرض في مكان عام، تتشتت المعلومات بين مجموعات ورسائل، ومن يجد الغرض لا يعرف كيف يصل لصاحبه. والنسخة الأولى من المشروع كانت تطابق بالكلمات فقط، وواجهتها بسيطة، والـ API فيه مفتوح بلا صلاحيات.","solution":"النسخة الثانية خادم Node واحد بجلسات وصلاحيات. فيها نموذج بلاغ بعدّة صور وخريطة، وتصفّح بفلاتر وترتيب، وبحث بالصورة عن طريق نموذج CLIP يعمل محليًا. المطابقة تجمع الصورة والكلمات والفئة واللون والماركة والمكان والتاريخ في درجة تشابه مع أسبابها، ثم طلب استرجاع خاص يتحقق فيه من وجد الغرض (والأدمن في الأغراض الثمينة).","role":"النسخة الأولى (PHP + Express) بنيتها بنفسي: الواجهات والـ API وقاعدة البيانات وخوارزمية المطابقة. النسخة الثانية طوّرتها بمساعدة مساعد برمجة بالذكاء الاصطناعي: إعادة التصميم، والبحث بالصورة، والطلبات، ولوحة الإدارة، والاختبارات.","steps":[{"body":"حتى 6 صور، ويقترح الذكاء الاصطناعي الفئة واللون من الصورة، والمكان يُحدَّد على الخريطة. وتفاصيل خاصة لا يراها إلا صاحب البلاغ.","title":"بلاغ في دقيقة"},{"body":"ترفع صورة فيرتّب النظام البلاغات حسب التشابه البصري (CLIP عبر transformers.js، بدون مفتاح API).","title":"بحث بالصورة"},{"body":"درجة من 0 إلى 95 مع الأسباب: الصورة، والفئة، والكلمات، واللون، والماركة، والمسافة، والتاريخ. وهي اقتراح فقط، لا تأكيد.","title":"مطابقة تشرح نفسها"},{"body":"طلب ملكية بإجابات خاصة، ثم مراجعة، ثم موافقة، ثم إرجاع، مع رسائل خاصة وسجل لكل خطوة ولوحة أدمن للنزاعات.","title":"استرجاع آمن"}],"highlights":[{"label":"بحث بالصورة واقتراح الفئة واللون محليًا","value":"AI"},{"label":"إشارات في درجة المطابقة مع شرح الأسباب","value":"7"},{"label":"اختبارًا آليًا للمطابقة ورحلات المستخدم","value":"22"}],"challenges":["معايرة تشابه الصور: درجات CLIP لأغراض مختلفة تتداخل مع درجات أغراض متشابهة، فقِستُها على صور العرض، وصار التشابه يظهر كوصف (مشابه جدًا / مشابه) بدل نسبة مضلِّلة.","الخصوصية: الخريطة العامة تُظهر منطقة تقريبية (~300 م)، وتُحذف بيانات الموقع من الصور، ولا يظهر الإيميل أو الهاتف، والبلاغات التي فيها أرقام أو روابط تنتظر المراجعة.","حماية الـ API: صلاحيات حسب الدور، وحماية CSRF، وحدود لعدد الطلبات، وفحص محتوى الصور الحقيقي بدل الاعتماد على الامتداد."],"learned":"استخدام نموذج ذكاء اصطناعي داخل منتج حقيقي بشكل صادق، يعني كاقتراح يقرّر فيه الإنسان، وتصميم سير عمل فيه أدوار وصلاحيات وسجل تدقيق.","tech":["Node.js","Express","MySQL","CLIP (transformers.js)","JavaScript","Leaflet","sharp","bcrypt"],"github_url":"https://github.com/asmaa21102/lost-found-project","live_url":"/live/lost-found/","demo":"match"},"next":{"slug":"bereket-charity","title":"Bereket — منصة تبرعات","tagline":"تبرّع بلمسة، وتابع أثر تبرعك حتى يصل"}},"prefix":"","path":"/projects/lost-and-found/"};</script>
