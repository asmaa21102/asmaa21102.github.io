<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>الطلب على الوظائف التقنية في تركيا</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root { --blue: #035b73; --blue-2: #0a7590; --gold: #bc935a; --ink: #142d36; --muted: #5e7680; --ivory: #f8f6f1; --mist: #e7eef0; --line: #dfe6e8; --card: #fff; }
.dark { --ink: #e9f1f3; --muted: #9fb3ba; --ivory: #0e1a1f; --mist: #152a32; --line: #22404a; --card: #12242b; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--ivory); color: var(--ink); font: 16px/1.75 'IBM Plex Sans Arabic', 'Inter', system-ui, sans-serif; }
[dir=ltr] body { font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif; }
button, select { font: inherit; color: inherit; }
.wrap { width: min(1100px, 100% - 32px); margin-inline: auto; }
.top { position: sticky; top: 0; z-index: 9; background: color-mix(in srgb, var(--ivory) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.top b { flex: 1; font-size: 15px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); text-decoration: none; color: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.hero { background: var(--blue); color: #f8f6f1; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 6px; background: var(--gold); }
.hero .wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: center; padding: 48px 0 56px; }
.kicker { color: var(--gold); font-weight: 700; letter-spacing: .02em; margin: 0 0 8px; }
.hero h1 { margin: 0; font-size: clamp(30px, 5vw, 50px); line-height: 1.2; }
.hero p { color: #d8e6ea; max-width: 560px; }
.hero img { width: 100%; border-radius: 18px; background: #f8f6f1; }
.tag { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 99px; background: rgba(188,147,90,.2); color: #f3dcb8; font-size: 13px; font-weight: 600; }
section { padding: 44px 0 0; }
h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 26px; color: var(--blue); }
.dark h2 { color: #7cc6d8; }
h2::before { content: ''; width: 6px; height: 26px; border-radius: 3px; background: var(--gold); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.kpi { padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--gold); }
.kpi b { display: block; font: 700 34px/1.1 'Inter', sans-serif; color: var(--blue); }
.dark .kpi b { color: #7cc6d8; }
.kpi span { color: var(--muted); font-size: 14px; }
.find { display: grid; gap: 10px; }
.find div { padding: 14px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.find strong { color: var(--blue); }
.dark .find strong { color: #7cc6d8; }
.explorer { display: grid; grid-template-columns: 260px 1fr; gap: 18px; }
.fams { display: flex; flex-direction: column; gap: 6px; }
.fam { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: start; }
.fam.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.panel { padding: 22px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); }
.panel h3 { margin: 0 0 4px; font-size: 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; }
.stats span { padding: 6px 12px; border-radius: 99px; background: var(--mist); font-size: 14px; }
.bar { display: grid; grid-template-columns: 200px 1fr 56px; gap: 12px; align-items: center; margin: 8px 0; font-size: 14px; }
.bar i { display: block; height: 12px; border-radius: 9px; background: var(--mist); overflow: hidden; }
.bar i b { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--blue), var(--blue-2)); transition: width .6s cubic-bezier(.2,.8,.2,1); }
[dir=rtl] .bar i b { background: linear-gradient(270deg, var(--blue), var(--blue-2)); }
.bar em { font-style: normal; font-weight: 700; direction: ltr; text-align: end; }
.note { color: var(--muted); font-size: 13px; margin-top: 12px; }
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
figure { margin: 0; padding: 14px; border-radius: 18px; background: #fff; border: 1px solid var(--line); cursor: zoom-in; }
figure img { width: 100%; display: block; }
figcaption { margin-top: 8px; color: #5e7680; font-size: 14px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; counter-reset: s; }
.steps div { padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.steps div::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 30px; height: 30px; margin-bottom: 8px; border-radius: 9px; background: var(--gold); color: #fff; font-weight: 700; }
.steps b { display: block; }
.steps span { color: var(--muted); font-size: 14px; }
.limits { padding: 18px 20px; border-radius: 18px; background: color-mix(in srgb, var(--gold) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); }
.limits ul { margin: 6px 0 0; padding-inline-start: 20px; }
.foot { margin: 48px 0 0; padding: 22px 0 30px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.zoom { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(10,20,25,.8); cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 92vh; border-radius: 12px; background: #fff; }
@media (max-width: 820px) {
  .hero .wrap, .explorer { grid-template-columns: 1fr; }
  .kpis, .steps { grid-template-columns: repeat(2, 1fr); }
  .gallery { grid-template-columns: 1fr; }
  .fams { flex-direction: row; flex-wrap: wrap; }
  .bar { grid-template-columns: 1fr 90px 50px; }
}
</style>
<script>try { if (localStorage.getItem('tj-theme') === 'dark') document.documentElement.classList.add('dark'); } catch {}</script>

  'حل المشكلات والتفكير التحليلي': ['Problem solving & analytical thinking', 'Problem çözme ve analitik düşünme'], 'هندسة أو تخصص ذو صلة': ['Engineering or a related field', 'Mühendislik veya ilgili alan'], 'أي شهادة مذكورة': ['Any professional certificate', 'Herhangi bir sertifika'], 'عن بعد': ['Remote', 'Uzaktan'], 'هجين': ['Hybrid', 'Hibrit'], 'في المكتب': ['On-site', 'Ofiste'], 'العمل ضمن فريق': ['Teamwork', 'Takım çalışması'], 'التواصل': ['Communication', 'İletişim'], 'بكالوريوس': ["Bachelor's degree", 'Lisans'], 'هندسة حاسوب أو علومه': ['Computer engineering or science', 'Bilgisayar mühendisliği/bilimi'], 'الإنجليزية': ['English', 'İngilizce'], 'السفر': ['Travel', 'Seyahat'], 'شهادات أمن (CISSP، CEH، OSCP، Security+)': ['Security certificates (CISSP, CEH, OSCP, Security+)', 'Güvenlik sertifikaları (CISSP, CEH, OSCP, Security+)'], 'Windows Server وActive Directory': ['Windows Server & Active Directory', 'Windows Server ve Active Directory'], 'TCP/IP، DNS، DHCP': ['TCP/IP, DNS, DHCP', 'TCP/IP, DNS, DHCP'], 'VPN، VLAN': ['VPN, VLAN', 'VPN, VLAN'],
};
const FIGS = ['f1_families', 'f2_cities', 'f3_levels', 'f4_experience', 'f5_exp_level', 'f6_edu_lang', 'f7_top_req', 'f8_heatmap', 'f9_workmode', 'f10_themes', 'f11_applicants'];
const LANGS = ['ar', 'en', 'tr'];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const store = { get: (k, d) => { try { return localStorage.getItem(k) || d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const q = new URLSearchParams(location.search).get('lang');
let lang = LANGS.includes(q) ? q : store.get('tj-lang', 'ar');
let data = null, fam = null;
const name = (s) => (lang === 'ar' ? s : (NAMES[s] || [s, s])[lang === 'en' ? 0 : 1]);
const num = (n) => new Intl.NumberFormat(lang === 'ar' ? 'ar-u-nu-latn' : lang === 'tr' ? 'tr-TR' : 'en-GB', { maximumFractionDigits: 1 }).format(n);

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = t.brand;
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t[el.dataset.t]));
  $('#lang').textContent = LANGS[(LANGS.indexOf(lang) + 1) % 3].toUpperCase();
  $('#find').innerHTML = t.finds.map(([h, p]) => `<div><strong>${esc(h)}:</strong> ${esc(p)}</div>`).join('');
  $('#limits').innerHTML = t.limits.map((l) => `<li>${esc(l)}</li>`).join('');
  $('#gallery').innerHTML = FIGS.map((f, i) => `<figure data-src="fig/${f}.png"><img src="fig/${f}.png" alt="${esc(t.figs[i])}" loading="lazy" /><figcaption>${esc(t.figs[i])}</figcaption></figure>`).join('');
  if (data) explorer();
}

function explorer() {
  const t = T[lang];
  const fams = Object.entries(data.families);
  fam ??= fams[0][0];
  $('#fams').innerHTML = fams.map(([k, v]) => `<button class="fam ${k === fam ? 'on' : ''}" data-f="${esc(k)}"><span>${esc(name(k))}</span><b>${v.n}</b></button>`).join('');
  const f = data.families[fam];
  const small = f.n < 10;
  $('#panel').innerHTML = `<h3>${esc(name(fam))}</h3>
    <div class="stats"><span>${f.n} ${t.ads} · ${num((100 * f.n) / data.n)}%</span><span>${t.median}: ${f.exp_median == null ? '—' : num(f.exp_median) + ' ' + t.years}</span><span>${num(f.english)}% ${t.english}</span></div>
    <b>${t.top}</b>
    ${f.top.map((r) => `<div class="bar"><span>${esc(name(r.name))}</span><i><b style="width:0" data-w="${r.pct}"></b></i><em>${num(r.pct)}%</em></div>`).join('')}
    ${small ? `<p class="note">⚠ ${t.none} (n = ${f.n})</p>` : ''}`;
  requestAnimationFrame(() => document.querySelectorAll('#panel [data-w]').forEach((b) => (b.style.width = b.dataset.w + '%')));
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]');
  if (b) { fam = b.dataset.f; explorer(); }
  const fig = e.target.closest('figure');
  if (fig) { $('#zoom img').src = fig.dataset.src; $('#zoom').hidden = false; }
  if (e.target.closest('#zoom')) $('#zoom').hidden = true;
});
addEventListener('keydown', (e) => e.key === 'Escape' && ($('#zoom').hidden = true));
$('#lang').addEventListener('click', () => { lang = LANGS[(LANGS.indexOf(lang) + 1) % 3]; store.set('tj-lang', lang); render(); });
$('#theme').addEventListener('click', () => store.set('tj-theme', document.documentElement.classList.toggle('dark') ? 'dark' : 'light'));
render();
fetch('data.json').then((r) => r.json()).then((d) => { data = d; explorer(); });
</script>
</body>
</html>
