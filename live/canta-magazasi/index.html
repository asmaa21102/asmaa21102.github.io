<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Çanta Mağazası</title>
    <meta name="description" content="Çanta Mağazası — demo online bag store." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
        // Theme and language before the first paint.
        try {
            const t = localStorage.getItem('cm-theme');
            if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        } catch {}
    </script>
</head>
<body>
    <a class="skip" href="#products" data-i18n="skip">Skip to products</a>
    <header class="top">
        <div class="wrap top-in">
            <a href="#" class="logo" aria-label="Çanta Mağazası">
                <span class="logo-mark">ç</span>
                <span class="logo-text">Çanta<em>Mağazası</em></span>
            </a>
            <label class="search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input id="q" type="search" autocomplete="off" data-i18n-placeholder="search" />
            </label>
            <div class="actions">
                <button class="icon-btn" id="lang" aria-label="Language"><span id="lang-label">TR</span></button>
                <button class="icon-btn" id="theme" data-i18n-aria="theme">
                    <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <button class="icon-btn" id="fav-open" data-i18n-aria="favorites">
                    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>
                    <span class="badge" id="fav-count" hidden>0</span>
                </button>
                <button class="icon-btn cart-btn" id="cart-open" data-i18n-aria="cart">
                    <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
                    <span class="badge" id="cart-count" hidden>0</span>
                </button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero wrap">
            <div class="hero-text">
                <p class="eyebrow" data-i18n="eyebrow">Yeni sezon · 2026</p>
                <h1 data-i18n-html="title">Her güne <em>bir çanta</em> hikâyesi</h1>
                <p class="lead" data-i18n="lead"></p>
                <div class="hero-cta">
                    <a href="#products" class="btn btn-dark" data-i18n="shop">Alışverişe başla</a>
                    <span class="perk"><svg viewBox="0 0 24 24"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg><span data-i18n="free_ship"></span></span>
                </div>
            </div>
            <div class="hero-art">
                <img src="img/v2-top-left.webp" alt="" class="hero-main" />
                <img src="img/14ba.jpg" alt="" class="hero-chip c1" />
                <img src="img/5ba.jpg" alt="" class="hero-chip c2" />
                <div class="hero-tag"><strong>17</strong><span data-i18n="models">model</span></div>
            </div>
        </section>

        <section class="wrap shop" id="products">
            <div class="toolbar">
                <div class="chips" id="chips" role="tablist"></div>
                <div class="tools">
                    <label class="range"><span data-i18n="max_price"></span> <output id="price-out"></output>
                        <input type="range" id="price" min="400" max="2000" step="100" value="2000" />
                    </label>
                    <select id="sort" aria-label="Sort">
                        <option value="featured" data-i18n="sort_featured"></option>
                        <option value="low" data-i18n="sort_low"></option>
                        <option value="high" data-i18n="sort_high"></option>
                        <option value="name" data-i18n="sort_name"></option>
                    </select>
                </div>
            </div>
            <p class="result-count" id="count" aria-live="polite"></p>
            <div class="grid" id="grid"></div>
            <div class="empty" id="empty" hidden>
                <p data-i18n="empty"></p>
                <button class="btn btn-ghost" id="reset" data-i18n="reset"></button>
            </div>
        </section>

        <section class="wrap features">
            <div><b data-i18n="f1"></b><span data-i18n="f1p"></span></div>
            <div><b data-i18n="f2"></b><span data-i18n="f2p"></span></div>
            <div><b data-i18n="f3"></b><span data-i18n="f3p"></span></div>
        </section>
    </main>

    <footer class="foot">
        <div class="wrap foot-in">
            <span>© 2026 Çanta Mağazası · Asmaa A. A. Aqel</span>
            <span class="demo" data-i18n="demo"></span>
        </div>
    </footer>

    <!-- Cart / favourites drawer -->
    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-labelledby="drawer-title">
        <div class="drawer-head">
            <h2 id="drawer-title"></h2>
            <button class="icon-btn" id="drawer-close" data-i18n-aria="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
        <div class="drawer-foot" id="drawer-foot"></div>
    </aside>

    <!-- Quick view / checkout modal -->
    <div class="modal" id="modal" hidden role="dialog" aria-modal="true">
        <div class="modal-card" id="modal-card"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <button class="to-top" id="to-top" data-i18n-aria="top"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
