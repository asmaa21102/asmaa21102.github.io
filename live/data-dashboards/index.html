<style>
:root { --bg: #f4f6fb; --card: #fff; --ink: #1d2433; --muted: #66708a; --line: #e3e7f0; --a: #2563eb; --b: #f59e0b; --c: #10b981; --d: #e11d48; --e: #8b5cf6; --xl: #107c41; --pbi: #f2c811; }
.dark { --bg: #0f1420; --card: #171e2e; --ink: #e7ebf3; --muted: #94a0b8; --line: #263049; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 'IBM Plex Sans Arabic', 'Inter', sans-serif; }
[dir=ltr] body { font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { width: min(1200px, 100% - 32px); margin-inline: auto; }
header { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
header .wrap { display: flex; align-items: center; gap: 10px; min-height: 64px; flex-wrap: wrap; padding-block: 8px; }
header h1 { font-size: 18px; margin: 0; flex: 1; }
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 14px; background: var(--bg); }
.tabs button { border: 0; background: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.tabs i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; color: #fff; }
.ib { height: 38px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; }
.intro { padding: 22px 0 6px; }
.intro h2 { margin: 0; font-size: 26px; }
.intro p { margin: 6px 0 0; color: var(--muted); max-width: 820px; }
.note { margin-top: 10px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--b) 14%, var(--card)); font-size: 13px; }
.dl { display: inline-flex; margin-top: 10px; gap: 8px; flex-wrap: wrap; }
.dl a { padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: inherit; text-decoration: none; font-size: 13px; font-weight: 600; }
.slicers { display: flex; flex-wrap: wrap; gap: 14px; margin: 16px 0; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.slicer b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.slicer div { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.chip.on { background: var(--a); border-color: var(--a); color: #fff; }
.reset { margin-inline-start: auto; align-self: end; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi b { display: block; font: 700 28px/1.2 'Inter', sans-serif; margin-top: 4px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin: 14px 0 30px; }
.panel { padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.panel canvas { width: 100% !important; height: 280px !important; }
.gauge { position: relative; }
.gauge canvas { height: 200px !important; }
.gauge strong { position: absolute; inset: auto 0 18% 0; text-align: center; font: 700 34px "Inter", sans-serif; }
footer { color: var(--muted); font-size: 13px; padding: 10px 0 30px; }
[hidden] { display: none !important; }
.views { display: inline-flex; gap: 4px; padding: 4px; margin: 14px 0 0; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
.views button { border: 0; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 600; color: var(--muted); }
.views button.on { background: var(--a); color: #fff; }
.compare { display: grid; gap: 16px; margin-top: 14px; }
.compare.side { grid-template-columns: 1fr 1fr; align-items: start; }
.compare h4 { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
.pbi-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 10px 30px -18px rgba(0,0,0,.4); background: #a0d1ff; }
.pbi-stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; direction: ltr; font-family: 'Segoe UI', 'Inter', sans-serif; color: #242424; }
.pbi-v { position: absolute; box-sizing: border-box; }
.pbi-v .pt { margin: 0; padding: 6px 10px; font: italic 700 20px 'Segoe UI', 'Inter', sans-serif; text-align: center; background: #a0d1ff; color: #0e1a76; }
.pbi-v canvas { display: block; }
.pbi-card { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 3px dotted #70bbff; text-align: center; }
.pbi-card b { font: 600 56px 'Segoe UI', 'Inter', sans-serif; color: #242424; }
.pbi-card span { font-size: 18px; color: #616161; margin-top: 6px; }
.pbi-head { display: flex; align-items: center; justify-content: center; background: #12239e; color: #fff; font: italic 700 53px 'Segoe UI', 'Inter', sans-serif; letter-spacing: .5px; }
.orig-note { font-size: 12px; color: var(--muted); margin-top: 8px; }
@media (max-width: 1100px) { .compare.side { grid-template-columns: 1fr; } }
@media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid { grid-template-columns: 1fr; } }
</style>

const LANGS = ['ar', 'en', 'tr'];
const $ = (s) => document.querySelector(s);
const q = new URLSearchParams(location.search).get('lang');
let lang = LANGS.includes(q) ? q : (() => { try { return localStorage.getItem('dd-lang') || 'ar'; } catch { return 'ar'; } })();
const t = (k) => T[lang][k] ?? k;
const fmt = (n, d = 0) => new Intl.NumberFormat(lang === 'ar' ? 'ar-u-nu-latn' : lang === 'tr' ? 'tr-TR' : 'en-US', { maximumFractionDigits: d }).format(n);
const PALETTE = ['#2563eb', '#f59e0b', '#10b981', '#e11d48', '#8b5cf6', '#06b6d4', '#64748b'];
let D, bike, survey;
const exF = { marital: null, education: null, region: null };
const pbF = { title: null, country: null };
const charts = {};
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function chart(id, cfg) {
  charts[id]?.destroy();
  Chart.defaults.color = css('--muted');
  Chart.defaults.borderColor = css('--line');
  Chart.defaults.font.family = lang === 'ar' ? 'IBM Plex Sans Arabic' : 'Inter';
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', rtl: lang === 'ar' } } }, cfg.options || {});
  charts[id] = new Chart(document.getElementById(id), cfg);
}
const avg = (a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0);
const groupBy = (rows, f) => rows.reduce((m, r) => ((m[f(r)] ??= []).push(r), m), {});

function slicers(box, defs, state, onChange) {
  box.innerHTML = defs.map(([key, values, label]) => `<div class="slicer"><b>${label}</b><div><button class="chip ${state[key] == null ? 'on' : ''}" data-k="${key}" data-v="">${t('all')}</button>${values.map((v) => `<button class="chip ${state[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${t(v)}</button>`).join('')}</div></div>`).join('') + `<button class="ib reset">${t('reset')}</button>`;
  box.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.classList.contains('reset')) Object.keys(state).forEach((k) => (state[k] = null));
    else state[b.dataset.k] = b.dataset.v || null;
    onChange();
  };
}

function renderExcel() {
  const R = bike.filter((r) => (!exF.marital || r.marital === exF.marital) && (!exF.education || r.education === exF.education) && (!exF.region || r.region === exF.region));
  slicers($('#ex-slicers'), [['marital', ['M', 'S'], t('marital')], ['education', [...new Set(bike.map((r) => r.education))], t('education')], ['region', [...new Set(bike.map((r) => r.region))], t('region')]], exF, renderExcel);
  const buyers = R.filter((r) => r.purchased);
  $('#ex-kpis').innerHTML = [[fmt(R.length), t('k_customers')], [fmt((100 * buyers.length) / (R.length || 1), 1) + '%', t('k_buyers')], ['$' + fmt(avg(R.map((r) => r.income))), t('k_income')], [fmt(avg(R.map((r) => r.age)), 1), t('k_age')]].map(([v, l]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
  const gender = ['F', 'M'];
  chart('c-income', { type: 'bar', data: { labels: gender.map((g) => t(g === 'F' ? 'Female' : 'Male')), datasets: [[0, t('not_bought'), PALETTE[0]], [1, t('bought'), PALETTE[1]]].map(([p, l, c]) => ({ label: l, backgroundColor: c, borderRadius: 6, data: gender.map((g) => Math.round(avg(R.filter((r) => r.gender === g && r.purchased === p).map((r) => r.income)))) })) }, options: { scales: { y: { beginAtZero: true } } } });
  const commute = ['0-1 Miles', '1-2 Miles', '2-5 Miles', '5-10 Miles', 'more than 10 miles'];
  const commuteLabel = (m) => m.replace('more than 10 miles', '10+ Miles');
  chart('c-commute', { type: 'line', data: { labels: commute.map(commuteLabel), datasets: [[0, t('not_bought'), PALETTE[0]], [1, t('bought'), PALETTE[1]]].map(([p, l, c]) => ({ label: l, borderColor: c, backgroundColor: c, tension: .3, data: commute.map((m) => R.filter((r) => r.commute === m && r.purchased === p).length) })) }, options: { scales: { y: { beginAtZero: true }, x: { reverse: lang === 'ar' } } } });
  const ages = ['YOUNG', 'Middle', 'old'];
  chart('c-age', { type: 'line', data: { labels: ages.map(t), datasets: [[0, t('not_bought'), PALETTE[0]], [1, t('bought'), PALETTE[1]]].map(([p, l, c]) => ({ label: l, borderColor: c, backgroundColor: c, tension: .3, data: ages.map((a) => R.filter((r) => r.age_bracket === a && r.purchased === p).length) })) }, options: { scales: { y: { beginAtZero: true }, x: { reverse: lang === 'ar' } } } });
}

function gauge(id, value, el, color) {
  chart(id, { type: 'doughnut', data: { datasets: [{ data: [value, 10 - value], backgroundColor: [color, css('--line')], borderWidth: 0 }] }, options: { rotation: -90, circumference: 180, cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: false } } } });
  $(el).textContent = fmt(value, 2);
}

function renderPbi() {
  const topCountries = ['United States', 'India', 'United Kingdom', 'Canada'];
  const country = (r) => (topCountries.includes(r.country) ? r.country : 'Other');
  const R = survey.filter((r) => (!pbF.title || r.title === pbF.title) && (!pbF.country || country(r) === pbF.country));
  const titles = Object.entries(groupBy(survey, (r) => r.title)).sort((a, b) => b[1].length - a[1].length).map(([k]) => k);
  slicers($('#pb-slicers'), [['title', titles, t('title')], ['country', [...topCountries, 'Other'], t('country')]], pbF, renderPbi);
  const sal = R.filter((r) => r.salary_k != null);
  $('#pb-kpis').innerHTML = [[fmt(R.length), t('k_resp')], [fmt(avg(R.map((r) => r.age).filter(Boolean)), 1), t('k_page')], ['$' + fmt(avg(sal.map((r) => r.salary_k)), 1) + 'k', t('k_sal')], [fmt((100 * R.filter((r) => r.language === 'Python').length) / (R.length || 1), 1) + '%', t('k_py')]].map(([v, l]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
  const byT = Object.entries(groupBy(sal, (r) => r.title)).map(([k, v]) => [k, avg(v.map((r) => r.salary_k))]).sort((a, b) => b[1] - a[1]);
  chart('c-salary', { type: 'bar', data: { labels: byT.map((x) => x[0]), datasets: [{ label: 'k USD', data: byT.map((x) => +x[1].toFixed(1)), backgroundColor: PALETTE[0], borderRadius: 6 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true, reverse: lang === 'ar' }, y: { position: lang === 'ar' ? 'right' : 'left' } } } });
  const langs = ['Python', 'R', 'Other', 'C/C++', 'JavaScript', 'Java'];
  const tl = titles.filter((x) => R.some((r) => r.title === x));
  chart('c-lang', { type: 'bar', data: { labels: tl, datasets: langs.map((l, i) => ({ label: l, backgroundColor: PALETTE[i], data: tl.map((x) => R.filter((r) => r.title === x && r.language === l).length) })) }, options: { scales: { x: { stacked: true, reverse: lang === 'ar' }, y: { stacked: true } } } });
  const byC = groupBy(R, country);
  const cl = [...topCountries, 'Other'].filter((c) => byC[c]);
  chart('c-country', { type: 'doughnut', data: { labels: cl, datasets: [{ data: cl.map((c) => byC[c].length), backgroundColor: PALETTE }] } });
  const byG = groupBy(sal.filter((r) => r.gender === 'Male' || r.gender === 'Female'), (r) => r.gender);
  chart('c-gender', { type: 'pie', data: { labels: ['Male', 'Female'].map(t), datasets: [{ data: ['Male', 'Female'].map((g) => +avg((byG[g] || []).map((r) => r.salary_k)).toFixed(1)), backgroundColor: [PALETTE[0], PALETTE[3]] }] } });
  gauge('c-wlb', avg(R.map((r) => r.happy_wlb).filter((x) => x != null)), '#wlb', PALETTE[2]);
  gauge('c-hsal', avg(R.map((r) => r.happy_salary).filter((x) => x != null)), '#hsal', PALETTE[1]);
}


// ── The original Power BI page, redrawn from the .pbix layout (positions, sizes, titles, theme colours) ──
const PBI = { blue: '#118DFF', navy: '#12239E', page: '#A0D1FF', vis20: '#40A4FF', titleBg: '#A0D1FF', titleInk: '#0E1A76', pink: '#EC8FCA', data: ['#118DFF', '#12239E', '#E66C37', '#6B007B', '#E044A7', '#744EC2', '#D9B300', '#D64550'] };
const LAYOUT = [
  { id: 'head', x: 11, y: 0, w: 1895, h: 157 },
  { id: 'card1', x: 726, y: 157, w: 210, h: 221 },
  { id: 'card2', x: 935, y: 155, w: 218, h: 221 },
  { id: 'bar', x: 11, y: 157, w: 610, h: 604, bg: PBI.blue, title: 'AVERAGE SALARY BY JOB TITLE', titleInk: PBI.titleInk },
  { id: 'col', x: 621, y: 375, w: 665, h: 701, bg: PBI.vis20, title: 'Count of Unique ID by Q1 - Which Title Best Fits your Current Role?.1 and Q5 - Favorite Programming Language.1', size: 16 },
  { id: 'country', x: 1286, y: 157, w: 635, h: 607, bg: PBI.vis20, title: ' Which Country do you live in?' },
  { id: 'gauge', x: 1286, y: 762, w: 635, h: 315, bg: PBI.blue, title: ' Happy WITH LIFE BALANCE', titleInk: PBI.navy },
  { id: 'gender', x: 0, y: 762, w: 621, h: 315, bg: PBI.vis20, title: 'average salary by Q9 - Male/Female?', titleInk: PBI.navy },
];
const origCharts = {};
function origChart(id, cfg) {
  origCharts[id]?.destroy();
  cfg.options = Object.assign({ responsive: false, animation: false, plugins: { legend: { position: 'right', labels: { color: '#242424', font: { size: 15 } } } } }, cfg.options || {});
  origCharts[id] = new Chart(document.getElementById('o-' + id), cfg);
}
function renderOriginal() {
  const st = $('#pbi-stage');
  st.style.background = PBI.page;
  st.innerHTML = LAYOUT.map((v) => {
    const box = `left:${v.x}px;top:${v.y}px;width:${v.w}px;height:${v.h}px;`;
    if (v.id === 'head') return `<div class="pbi-v pbi-head" style="${box}">DATA PROFESSIONAL SURVEY BREAKDOWN</div>`;
    if (v.id.startsWith('card')) return `<div class="pbi-v pbi-card" style="${box}"><b id="o-${v.id}"></b><span>${v.id === 'card1' ? 'Count of Unique ID' : 'Average of Q10 - Current Age'}</span></div>`;
    const th = 44;
    return `<div class="pbi-v" style="${box}background:${v.bg}"><p class="pt" style="${v.titleInk ? 'color:' + v.titleInk + ';' : ''}${v.size ? 'font-size:' + v.size + 'px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' : ''}">${v.title}</p><canvas id="o-${v.id}" width="${v.w - 16}" height="${v.h - th - 12}" style="margin:6px 8px"></canvas></div>`;
  }).join('');
  const sal = survey.filter((r) => r.salary_k != null);
  $('#o-card1').textContent = fmt(survey.length);
  $('#o-card2').textContent = avg(survey.map((r) => r.age)).toFixed(2);
  const ax = { ticks: { color: '#242424', font: { size: 14 } }, grid: { color: 'rgba(0,0,0,.12)' } };
  const byT = Object.entries(groupBy(sal, (r) => r.title)).map(([k, v]) => [k, avg(v.map((r) => r.salary_k * 1000))]).sort((a, b) => b[1] - a[1]);
  origChart('bar', { type: 'bar', data: { labels: byT.map((x) => x[0]), datasets: [{ label: 'average salary', data: byT.map((x) => Math.round(x[1])), backgroundColor: PBI.navy }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ...ax, title: { display: true, text: 'average salary', color: '#242424', font: { size: 15 } }, ticks: { ...ax.ticks, callback: (v) => v / 1000 + 'K' } }, y: { ...ax, title: { display: true, text: 'JOB TITLE', color: '#242424', font: { size: 16, weight: 'bold' } } } } } });
  const titles = Object.entries(groupBy(survey, (r) => r.title)).sort((a, b) => b[1].length - a[1].length).map(([k]) => k);
  const langs = ['Python', 'R', 'Other', 'C/C++', 'JavaScript', 'Java'];
  origChart('col', { type: 'bar', data: { labels: titles, datasets: langs.map((l, i) => ({ label: l, backgroundColor: PBI.data[i], data: titles.map((x) => survey.filter((r) => r.title === x && r.language === l).length) })) }, options: { plugins: { legend: { position: 'top', labels: { color: '#242424' } } }, scales: { x: { ...ax, stacked: true, ticks: { ...ax.ticks, font: { size: 12 } } }, y: { ...ax, stacked: true } } } });
  const byC = Object.entries(groupBy(survey, (r) => r.country)).map(([k, v]) => [k, v.length]).sort((a, b) => b[1] - a[1]).slice(0, 8);
  origChart('country', { type: 'pie', data: { labels: byC.map((x) => x[0]), datasets: [{ data: byC.map((x) => x[1]), backgroundColor: PBI.data, borderColor: '#fff', borderWidth: 1 }] } });
  const byG = groupBy(sal, (r) => r.gender);
  const gk = Object.keys(byG).sort((a, b) => byG[b].length - byG[a].length);
  origChart('gender', { type: 'pie', data: { labels: gk, datasets: [{ data: gk.map((g) => Math.round(avg(byG[g].map((r) => r.salary_k * 1000)))), backgroundColor: PBI.data, borderColor: '#fff', borderWidth: 1 }] } });
  const w = avg(survey.map((r) => r.happy_wlb).filter((x) => x != null));
  origChart('gauge', { type: 'doughnut', data: { datasets: [{ data: [w, w * 2 - w], backgroundColor: [PBI.pink, '#E6E6E6'], borderWidth: 0 }] }, options: { rotation: -90, circumference: 180, cutout: '62%', plugins: { legend: { display: false }, tooltip: { enabled: false } } }, plugins: [{ id: 'callout', afterDraw(c) { const { ctx, chartArea: a } = c; ctx.save(); ctx.fillStyle = '#242424'; ctx.font = '600 44px Segoe UI, Inter, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(w.toFixed(2), (a.left + a.right) / 2, a.bottom - 20); ctx.font = '16px Segoe UI, Inter, sans-serif'; ctx.fillStyle = '#242424'; ctx.textAlign = 'left'; ctx.fillText('0.00', a.left + 40, a.bottom); ctx.textAlign = 'right'; ctx.fillText((w * 2).toFixed(2), a.right - 40, a.bottom); ctx.restore(); } }] });
  fitStage();
}
function fitStage() {
  const fr = $('#pbi-stage')?.parentElement; if (!fr) return;
  $('#pbi-stage').style.transform = `scale(${fr.clientWidth / 1920})`;
}
addEventListener('resize', fitStage);
let pbView = 'orig';
function setView(v) {
  pbView = v;
  document.querySelectorAll('#pb-views button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  $('#pb-orig').hidden = v === 'new'; $('#pb-new').hidden = v === 'orig';
  $('#pb-compare').classList.toggle('side', v === 'side');
  render();
}
$('#pb-views').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); });

function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.title = t('brand');
  document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t(el.dataset.t)));
  $('#lang').textContent = LANGS[(LANGS.indexOf(lang) + 1) % 3].toUpperCase();
  if (!D) return;
  if ($('#excel').hidden) { if (pbView !== 'new') renderOriginal(); if (pbView !== 'orig') renderPbi(); } else renderExcel();
}
document.querySelector('.tabs').addEventListener('click', (e) => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('#excel').hidden = b.dataset.tab !== 'excel'; $('#pbi').hidden = b.dataset.tab !== 'pbi';
  render();
});
$('#lang').addEventListener('click', () => { lang = LANGS[(LANGS.indexOf(lang) + 1) % 3]; try { localStorage.setItem('dd-lang', lang); } catch {} render(); });
$('#theme').addEventListener('click', () => { const d = document.documentElement.classList.toggle('dark'); try { localStorage.setItem('dd-theme', d ? 'dark' : 'light'); } catch {} render(); });
render();
fetch('data.json').then((r) => r.json()).then((d) => {
  D = d;
  const rows = (o) => o.rows.map((r) => Object.fromEntries(o.cols.map((c, i) => [c, r[i]])));
  bike = rows(d.bike); // duplicates by customer ID were removed when the data was prepared
  survey = rows(d.survey);
  $('#pb-new').hidden = true;
  if (new URLSearchParams(location.search).get('tab') === 'pbi') document.querySelector('[data-tab=pbi]').click(); else render();
});
</script>
</body>
