<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ATL Smart Lab — demo</title>
  <link rel="icon" href="app/images/logo2.jpg" />
  <style>
    html, body { margin: 0; height: 100%; background: #eaf4ff; }
    body { display: flex; flex-direction: column; }
    .demo-strip { display: flex; gap: .6rem; align-items: center; justify-content: center; flex-wrap: wrap; padding: .45rem 1rem; font: 500 .8rem/1.4 system-ui, sans-serif; background: #0b3b66; color: #e6f2ff; text-align: center; }
    .demo-strip a, .demo-strip button { border: 1px solid #e6f2ff66; background: transparent; color: inherit; border-radius: 999px; padding: .15rem .7rem; font: inherit; cursor: pointer; text-decoration: none; }
    .demo-strip a:hover, .demo-strip button:hover { background: #e6f2ff22; }
    #st { opacity: .85; }
    iframe { flex: 1; width: 100%; border: 0; display: block; }
  </style>
  <script type="module" crossorigin src="/live/smart-lab/assets/index-z-HDHCLK.js"></script>
</head>
<body>
  <div class="demo-strip" role="note"><span id="note"></span><span id="st" aria-live="polite"></span><a id="sample" href="../samples/smart-lab-sample-report.pdf" download></a><button id="reset" type="button"></button></div>
  <iframe id="app" title="ATL Smart Lab"></iframe>
</body>
</html>
