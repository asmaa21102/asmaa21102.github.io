<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Task</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff4fa3'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script src="js/demo-api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
</head>
<body class="auth-body">
  <div class="auth-tools"><button class="glass-pill lang-btn" id="lang">EN</button><button class="glass-pill" id="theme" aria-label="Theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button></div>
  <main class="auth-scene">
    <div class="auth-bg" aria-hidden="true">
      <span class="auth-glow g1"></span><span class="auth-glow g2"></span>
      <svg class="auth-route" viewBox="0 0 1000 700" preserveAspectRatio="none"><path d="M220 600 C 330 470, 380 620, 500 500 S 700 300, 800 240" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round"/></svg>
      <span class="auth-pin todo" style="left:22%;top:86%"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
      <span class="auth-pin done" style="left:80%;top:34%"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="auth-bubble" style="width:96px;height:96px;left:8%;top:14%;animation-delay:0s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="auth-bubble" style="width:70px;height:70px;left:84%;top:12%;animation-delay:-2s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="auth-bubble" style="width:58px;height:58px;left:72%;top:64%;animation-delay:-4s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
      <span class="auth-bubble" style="width:84px;height:84px;left:12%;top:70%;animation-delay:-6s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
      <span class="auth-bubble" style="width:52px;height:52px;left:90%;top:44%;animation-delay:-1s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>
      <span class="auth-bubble" style="width:64px;height:64px;left:4%;top:42%;animation-delay:-3s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>
      <span class="auth-bubble" style="width:46px;height:46px;left:30%;top:8%;animation-delay:-5s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg></span>
      <span class="auth-bubble" style="width:40px;height:40px;left:62%;top:6%;animation-delay:-7s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></span>
      <span class="auth-bubble" style="width:44px;height:44px;left:52%;top:86%;animation-delay:-2.5s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span>
      <span class="auth-bubble" style="width:36px;height:36px;left:24%;top:88%;animation-delay:-6.5s"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <span class="auth-dot" style="left:18%;top:24%;animation-delay:0s"></span>
      <span class="auth-dot" style="left:66%;top:18%;animation-delay:-1s"></span>
      <span class="auth-dot" style="left:80%;top:30%;animation-delay:-2s"></span>
      <span class="auth-dot" style="left:40%;top:62%;animation-delay:-3s"></span>
      <span class="auth-dot" style="left:58%;top:72%;animation-delay:-1.5s"></span>
      <span class="auth-dot" style="left:28%;top:48%;animation-delay:-2.5s"></span>
      <span class="auth-dot" style="left:88%;top:78%;animation-delay:-0.5s"></span>
      <span class="auth-dot" style="left:10%;top:90%;animation-delay:-3.5s"></span>
      <svg class="auth-waves" viewBox="0 0 1440 320" preserveAspectRatio="none"><path class="w1" d="M0 160 C 240 100 480 240 720 180 S 1200 80 1440 150 V320 H0z"/><path class="w2" d="M0 210 C 300 150 520 280 820 220 S 1240 150 1440 210 V320 H0z"/><path class="w3" d="M0 260 C 360 220 700 310 1040 260 S 1320 230 1440 250 V320 H0z"/></svg>
    </div>

    <div class="auth-wrap">
      <form class="auth-card" id="form" novalidate>
        <div class="auth-brand"><span class="logo-mark">✓</span><b>Smart Task</b></div>
        <h1 class="auth-title" id="auth-title"></h1>
        <p class="auth-sub" data-t="tagline"></p>
        <div class="auth-field reg-only" hidden><label class="pill-input"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input name="username" autocomplete="name" maxlength="40" data-t-ph="username" /></label></div>
        <div class="auth-field"><label class="pill-input"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><input name="email" type="email" dir="ltr" autocomplete="email" data-t-ph="email" required /></label></div>
        <div class="auth-field"><label class="pill-input"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input name="password" type="password" autocomplete="current-password" data-t-ph="password" required /><button type="button" class="pw-toggle" id="pw-toggle" data-t-aria="password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></label></div>
        <p class="auth-hint reg-only" hidden data-t="pw_hint"></p>
        <p class="auth-error" id="error" role="alert"></p>
        <button class="auth-btn" id="submit"><span id="submit-label"></span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="auth-switch"><span id="switch-q"></span> <a href="#" id="switch"></a></p>
        <div class="auth-demo"><button type="button" class="demo-chip" id="demo"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span data-t="demo"></span></button></div>
      </form>
      <ul class="auth-perks">
        <li><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span data-t="f1"></span></li>
        <li><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg><span data-t="f2"></span></li>
        <li><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-t="f3"></span></li>
        <li><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/></svg><span data-t="f4"></span></li>
      </ul>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
