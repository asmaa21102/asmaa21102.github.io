<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asmaa Aqel — App preview</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=space-grotesk:400,600" rel="stylesheet">
    <style>
        :root { --bg: #090c16; --line: rgb(255 255 255 / 0.1); --text: #eef2fb; --mist: #9aa5c4; --cyan: #5ddcf0; --violet: #a46bfa; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 20px; padding: 24px 16px;
            background: radial-gradient(60rem 40rem at 20% 10%, rgb(164 107 250 / 0.18), transparent 60%),
                        radial-gradient(50rem 30rem at 90% 90%, rgb(93 220 240 / 0.12), transparent 60%), var(--bg);
            color: var(--text); font-family: 'Space Grotesk', system-ui, sans-serif;
        }
        header { text-align: center; }
        header p { margin: 0 0 4px; font-size: 12px; letter-spacing: 0.25em; color: var(--cyan); }
        header h1 { margin: 0; font-size: 22px; font-weight: 600; }
        .phone {
            width: min(390px, 100%); height: min(780px, calc(100vh - 160px)); min-height: 560px;
            border-radius: 44px; padding: 46px 12px 14px; background: linear-gradient(160deg, #2a2f45, #10131f);
            box-shadow: 0 0 0 1px var(--line), 0 40px 120px -30px rgb(164 107 250 / 0.55);
            position: relative;
        }
        .phone::before {
            content: ''; position: absolute; top: 14px; left: 50%; translate: -50% 0; z-index: 2;
            width: 96px; height: 24px; border-radius: 999px; background: #05060b;
        }
        iframe { width: 100%; height: 100%; border: 0; border-radius: 8px 8px 32px 32px; background: #fff; }
        a { color: var(--mist); font-size: 14px; text-decoration: none; }
        a:hover { color: var(--cyan); }
        .actions { display: flex; gap: 20px; }
    </style>
</head>
<body>
    <header>
        <p>LIVE APP · FLUTTER WEB</p>
        <h1 id="title">App</h1>
    </header>
    <div class="phone"><iframe id="app" title="App preview"></iframe></div>
    <div class="actions">
        <a href="/">← Portfolio</a>
        <a id="full" href="#" target="_blank" rel="noreferrer">Open full screen ↗</a>
    </div>
    <script>
        // Only allow apps that live under /live/ on this site.
        const params = new URLSearchParams(location.search);
        const app = params.get('app') || '';
        if (/^[a-z0-9-]+$/.test(app)) {
            const src = '/live/' + app + '/index.html';
            document.getElementById('app').src = src;
            document.getElementById('full').href = src;
        }
        document.getElementById('title').textContent = params.get('title') || 'App';
        document.title = (params.get('title') || 'App') + ' — Asmaa Aqel';
    </script>
</body>
</html>
