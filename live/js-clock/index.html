<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="index.css" />
    <script>try { if (localStorage.getItem('clk-theme') === 'light') document.documentElement.classList.add('light'); } catch {}</script>
</head>
<body>
    <div class="app">
        <header class="bar">
            <div class="brand"><span class="dot"></span><span>Saat</span></div>
            <nav class="tabs" role="tablist">
                <button role="tab" data-tab="clock" class="on" data-i18n="clock"></button>
                <button role="tab" data-tab="world" data-i18n="world"></button>
                <button role="tab" data-tab="stopwatch" data-i18n="stopwatch"></button>
                <button role="tab" data-tab="timer" data-i18n="timer"></button>
            </nav>
            <div class="tools">
                <button class="ic" id="lang" aria-label="Language"><b id="lang-label">TR</b></button>
                <button class="ic" id="theme" aria-label="Theme"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
            </div>
        </header>

        <!-- Clock -->
        <section class="panel on" id="clock">
            <div class="clock-wrap">
                <svg class="analog" viewBox="0 0 200 200" aria-hidden="true">
                    <circle cx="100" cy="100" r="94" class="face" />
                    <g id="ticks"></g>
                    <line id="h" x1="100" y1="100" x2="100" y2="52" class="hand hh" />
                    <line id="m" x1="100" y1="100" x2="100" y2="30" class="hand mh" />
                    <line id="s" x1="100" y1="114" x2="100" y2="22" class="hand sh" />
                    <circle cx="100" cy="100" r="4.5" class="pin" />
                </svg>
                <div class="digital">
                    <div class="time" id="time" aria-live="off">00:00:00</div>
                    <div class="date" id="date"></div>
                    <div class="row">
                        <button class="pill" id="fmt"></button>
                        <span class="greet" id="greet"></span>
                    </div>
                    <div class="day"><span data-i18n="day_progress"></span><i><b id="dayp"></b></i><em id="dayp-n"></em></div>
                </div>
            </div>
        </section>

        <!-- World -->
        <section class="panel" id="world">
            <div class="world-head">
                <h2 data-i18n="world"></h2>
                <select id="add-city" aria-label="Add city"></select>
            </div>
            <div class="cities" id="cities"></div>
        </section>

        <!-- Stopwatch -->
        <section class="panel" id="stopwatch">
            <div class="big" id="sw">00:00.00</div>
            <div class="ctrl">
                <button class="btn ghost" id="sw-lap" data-i18n="lap" disabled></button>
                <button class="btn" id="sw-go" data-i18n="start"></button>
                <button class="btn ghost" id="sw-reset" data-i18n="reset" disabled></button>
            </div>
            <ol class="laps" id="laps"></ol>
        </section>

        <!-- Timer -->
        <section class="panel" id="timer">
            <div class="timer-ring">
                <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" class="track" /><circle cx="100" cy="100" r="88" class="prog" id="ring" /></svg>
                <div class="big" id="tm">05:00</div>
            </div>
            <div class="presets" id="presets"></div>
            <div class="set">
                <label><input type="number" id="tm-min" min="0" max="180" value="5" /><span data-i18n="min"></span></label>
                <label><input type="number" id="tm-sec" min="0" max="59" value="0" /><span data-i18n="sec"></span></label>
            </div>
            <div class="ctrl">
                <button class="btn" id="tm-go" data-i18n="start"></button>
                <button class="btn ghost" id="tm-reset" data-i18n="reset"></button>
            </div>
        </section>

        <footer class="foot">Asmaa Alaa Aqel</footer>
    </div>
    <div class="alert" id="alert" hidden><div><p class="ding">⏰</p><h2 data-i18n="done"></h2><button class="btn" id="alert-ok">OK</button></div></div>
    <script src="index.js"></script>
</body>
</html>
