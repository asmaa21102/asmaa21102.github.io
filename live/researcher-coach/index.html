<title>الباحث مع Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* الخط: مجلة من جهاز القارئ، وNoto Naskh Arabic بديلاً */
@font-face{font-family:"Majalla";src:local("Sakkal Majalla"),local("SakkalMajalla"),local("SakkalMajalla-Regular");font-weight:400;size-adjust:142%}
@font-face{font-family:"Majalla";src:local("Sakkal Majalla Bold"),local("SakkalMajalla-Bold");font-weight:700;size-adjust:142%}
:root{
  --bg:#F6F2EA;--paper:#FFFFFF;--ink:#142D36;--muted:#5A707A;--teal:#035B73;--deep:#0B3F50;--gold:#BC935A;--sand:#EFE4D2;--line:rgba(20,45,54,.12);--chip:#E7EEF0;
  --ok:#2F8A55;--bad:#B04D45;--warn:#B26A14;
  --b-read:#2B7A99;--b-do:#A87A35;--b-shape:#5E8A45;--b-rule:#B04D45;--b-stop:#6A57A4;
  --f:"Majalla","Noto Naskh Arabic","Sakkal Majalla",Tahoma,serif;--mono:"IBM Plex Mono",Consolas,"Majalla",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1D23;--paper:#14272E;--ink:#E8EFF0;--muted:#97AEB5;--teal:#6CBBD0;--deep:#0A2A33;--gold:#D8B07A;--sand:#2B2620;--line:rgba(232,239,240,.12);--chip:#1C343C;--ok:#6CC892;--bad:#E0847B;--warn:#E3A55A;--b-read:#6BB4D2;--b-do:#D9AD69;--b-shape:#93C17A;--b-rule:#E0847B;--b-stop:#A797DE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1D23;--paper:#14272E;--ink:#E8EFF0;--muted:#97AEB5;--teal:#6CBBD0;--deep:#0A2A33;--gold:#D8B07A;--sand:#2B2620;--line:rgba(232,239,240,.12);--chip:#1C343C;--ok:#6CC892;--bad:#E0847B;--warn:#E3A55A;--b-read:#6BB4D2;--b-do:#D9AD69;--b-shape:#93C17A;--b-rule:#E0847B;--b-stop:#A797DE;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:21px;line-height:1.8;direction:rtl}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.3;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:23px;color:var(--teal)}
.logo img{width:36px;height:36px;border-radius:10px}
.sp{flex:1}
.toplink{text-decoration:none;font-weight:700;font-size:18px;color:var(--ink);padding:4px 14px;border-radius:999px}
.toplink:hover{background:var(--chip)}
.role{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.role button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:16px;padding:3px 14px;border-radius:999px}
.role button[aria-pressed="true"]{background:var(--teal);color:var(--paper)}
.live{display:none;margin:16px auto 0;border-radius:18px;padding:12px 20px;background:var(--gold);color:#fff;gap:14px;align-items:center}
.live.on{display:flex}
.live i{width:12px;height:12px;border-radius:50%;background:#fff;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
.live small{display:block;font-size:15px;opacity:.9}
.live p{font-size:22px;font-weight:700}

.hero{position:relative;margin-top:22px;border-radius:34px;overflow:hidden;background:linear-gradient(135deg,#0B3F50 0%,#035B73 62%,#2B7A99 100%);color:#fff;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;min-height:440px}
.hero>*{min-width:0}
.hero .txt{padding:42px 44px;position:relative;z-index:1}
.hero .k{display:inline-block;background:rgba(255,255,255,.14);border-radius:999px;padding:2px 16px;font-size:16px;font-weight:700;color:#F5D9AE}
.hero h1{font-size:clamp(36px,5.4vw,62px);margin:14px 0 12px}
.hero h1 em{font-style:normal;color:#F5D9AE}
.hero p{font-size:21px;color:#D5E7EC;max-width:46ch}
.hero .art{position:relative;align-self:stretch;min-height:420px;display:grid;place-items:center}
.hero .art .robot{width:min(300px,80%);margin-top:70px;position:relative;z-index:1}
.bubble{position:absolute;background:#fff;color:#142D36;border-radius:24px;box-shadow:0 20px 40px -18px rgba(0,0,0,.45);font-weight:700;line-height:1.5;z-index:2}
.bubble::after{content:"";position:absolute;bottom:-14px;right:46px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble .caret{display:inline-block;width:3px;height:1em;background:#BC935A;margin-right:3px;vertical-align:middle;animation:blink .8s infinite}
.hero .bubble{top:18px;left:8%;right:22%;font-size:19px;padding:12px 18px;min-height:60px}
.chip{position:absolute;z-index:1;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:3px 14px;font-size:15px;font-weight:700;backdrop-filter:blur(4px);animation:float 5s ease-in-out infinite alternate}
.chip:nth-child(odd){animation-duration:6.5s}
/* الروبوت */
.robot .rb{animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.robot .eyes ellipse{transform-box:fill-box;transform-origin:center;animation:blinkE 4.2s infinite}
@keyframes blinkE{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
.robot .ant{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{fill:#FFFFFF;filter:drop-shadow(0 0 12px #F5D9AE)}}
.robot .arm{transform-box:fill-box;transform-origin:50% 100%;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:rotate(-22deg)}}
.robot .mouth{transform-box:fill-box;transform-origin:center}
.robot.talk .mouth{animation:talk .2s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(3)}}
.robot .core{animation:corep 2s ease-in-out infinite}
@keyframes corep{50%{opacity:.55}}
.robot .halo{transform-box:fill-box;transform-origin:center;animation:haloP 4s ease-in-out infinite}
@keyframes haloP{50%{transform:scale(1.08);opacity:.7}}
.robot .spark{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
.robot .spark:nth-of-type(2){animation-delay:.8s}.robot .spark:nth-of-type(3){animation-delay:1.6s}
@keyframes tw{50%{opacity:.15;transform:scale(.4)}}
.robot .ln{transform-box:fill-box;transform-origin:100% 50%;animation:write 4.8s ease-in-out infinite}
.robot .l2{animation-delay:.6s}.robot .l3{animation-delay:1.2s}.robot .l4{animation-delay:1.8s}
@keyframes write{0%{transform:scaleX(0)}25%,80%{transform:scaleX(1)}100%{transform:scaleX(0);opacity:0}}
.robot .hand{transform-box:fill-box;transform-origin:center;animation:tap .5s ease-in-out infinite alternate}
.robot .hand.h2{animation-delay:.25s}
@keyframes tap{to{transform:translateY(-5px)}}
.fly{position:absolute;left:50%;top:66%;z-index:2;white-space:nowrap;background:#fff;color:#0B3F50;border-radius:12px;padding:4px 12px;font-family:var(--mono);font-size:14px;box-shadow:0 12px 26px -12px rgba(0,0,0,.5);pointer-events:none;direction:ltr;animation:rise 3.6s ease-out forwards}
.fly.big{font-size:28px;padding:8px 20px;border-radius:18px;--up:-440px}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.5)}15%{opacity:1;transform:translate(-50%,-30px) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),var(--up,-250px)) scale(.9)}}
.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:60px solid rgba(255,255,255,.05);right:-160px;bottom:-200px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:8px 20px;font-weight:700;font-size:18px;background:var(--gold);color:#fff;text-decoration:none}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.line{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:26px}
.day{position:relative;overflow:hidden;border-radius:26px;background:var(--paper);border:1px solid var(--line);padding:20px 18px 16px;text-decoration:none;display:flex;flex-direction:column;gap:8px;min-height:250px;transition:transform .25s,box-shadow .25s}
.day:hover{transform:translateY(-5px);box-shadow:0 22px 40px -26px var(--c)}
.day::before{content:"";position:absolute;inset:auto -40px -60px auto;width:170px;height:170px;border-radius:50%;background:var(--c);opacity:.12}
.day .n{font-size:64px;font-weight:700;line-height:.9;color:var(--c)}
.day .ic{position:absolute;left:16px;top:18px;font-size:34px}
.day b{font-size:22px;line-height:1.35}
.day span{font-size:16px;color:var(--muted);line-height:1.6}
.day .go{margin-top:auto;font-weight:700;color:var(--c);font-size:17px}
.sec{margin-top:44px}
.sec h2{font-size:clamp(26px,3.4vw,36px)}
.sec .lead,.lead{color:var(--muted);font-size:19px;margin-top:6px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.three div{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px}
.three i{font-style:normal;font-size:34px}
.three b{display:block;font-size:21px;margin-top:6px}
.three p{color:var(--muted);font-size:17px}

.dhead{margin-top:22px;border-radius:32px;padding:34px 36px;color:#fff;background:linear-gradient(135deg,#0B3F50,var(--c));position:relative;overflow:hidden}
.dhead::after{content:attr(data-n);position:absolute;left:30px;top:-30px;font-size:240px;font-weight:700;line-height:1;opacity:.12}
.dhead small{font-size:17px;color:#F5D9AE;font-weight:700}
.dhead h1{font-size:clamp(32px,4.6vw,52px);margin:6px 0 10px}
.dhead p{font-size:20px;color:#E1EEF1;max-width:60ch}
.outline{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:16px;counter-reset:o}
.outline a{counter-increment:o;display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 14px;text-decoration:none;font-size:17px;line-height:1.4}
.outline a::before{content:counter(o);flex:0 0 32px;height:32px;border-radius:10px;background:var(--chip);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:16px}
.outline a:hover{border-color:var(--c)}
.task{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:16px;border-top:6px solid var(--c)}
.task h3{font-size:23px;display:flex;gap:10px;align-items:center}
.task h3 i{font-style:normal;width:36px;height:36px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:18px}
.task>p{color:var(--muted);margin:6px 0 12px;font-size:18px}
textarea{width:100%;min-height:140px;resize:vertical;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:20px;line-height:1.8}
.meter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.meter span{font-size:15px;font-weight:700;border-radius:999px;padding:0 12px;border:1.5px dashed var(--c);color:var(--c);opacity:.5}
.meter span.hit{opacity:1;border-style:solid;background:color-mix(in srgb,var(--c) 14%,transparent)}
.meter em{font-style:normal;margin-right:auto}
.msg{font-weight:700;font-size:16px}
.model{display:none;margin-top:12px;border-radius:16px;padding:12px 16px;background:var(--sand)}
.model.on{display:block}
.model small{display:block;font-weight:700;color:var(--gold);font-size:15px}
.model p{white-space:pre-wrap;font-size:18px}
.state{font-size:14px;font-weight:700;border-radius:999px;padding:0 10px;background:var(--chip);color:var(--muted)}
.state.sent{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.state.star{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--gold)}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:24px;margin-top:22px}
select,.in{font-family:inherit;font-size:18px;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--bg);color:var(--ink);max-width:100%}
.hands{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hands span{font-size:15px;font-weight:700;border-radius:999px;padding:1px 12px;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;margin-top:14px}
.post{border:1px solid var(--line);border-radius:18px;padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.post header{display:flex;gap:8px;align-items:center}
.post img{width:30px;height:30px;border-radius:50%}
.post header b{font-size:17px;display:block;line-height:1.3}
.post header small{color:var(--muted);font-size:14px}
.post p{font-size:17px;white-space:pre-wrap;overflow-wrap:anywhere}
.star-btn{margin-right:auto;border:1.5px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:0 10px;font-size:15px;font-weight:700}
.star-btn.on{background:var(--gold);color:#fff}
.empty{color:var(--muted);text-align:center;padding:26px;border:1.5px dashed var(--line);border-radius:16px;margin-top:14px}
.trainer{display:none!important}
body.is-trainer .trainer{display:flex!important}
footer{margin:60px 0 40px;color:var(--muted);font-size:15px;text-align:center}
.three.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.three.four{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero .art{min-height:300px;margin:0 18px 18px}.days{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:1fr}}
@media (max-width:460px){.days{grid-template-columns:1fr}.hero .txt{padding:28px 22px}}

/* ================= العرض ================= */
.deck{position:fixed;inset:0;z-index:100;background:#071C23;color-scheme:light;
  --bg:#F6F2EA;--paper:#FFFFFF;--ink:#142D36;--muted:#5A707A;--teal:#035B73;--deep:#0B3F50;--gold:#BC935A;--sand:#EFE4D2;--line:rgba(20,45,54,.12);--chip:#E7EEF0;--ok:#2F8A55;--bad:#B04D45;
  --b-read:#2B7A99;--b-do:#A87A35;--b-shape:#5E8A45;--b-rule:#B04D45;--b-stop:#6A57A4;color:var(--ink)}
.dprog{position:absolute;top:0;right:0;height:5px;background:linear-gradient(to left,#BC935A,#6CBBD0);transition:width .4s;z-index:3}
.stage{position:absolute;left:50%;top:calc(50% - 28px);width:1600px;height:900px;border-radius:24px;overflow:hidden;background:#F6F2EA;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);font-size:40px;line-height:1.55}
.dbar{position:absolute;bottom:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;color:#CFE2E7;font-size:17px}
.dbar button{font-family:inherit;font-size:17px;border:0;border-radius:10px;padding:4px 14px;background:rgba(255,255,255,.1);color:#EEF6F7}
.dbar .cnt{min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer}
.dots i.on{background:#BC935A;width:26px;border-radius:6px}

.sl{position:absolute;inset:0;padding:70px 100px 76px;display:flex;flex-direction:column;overflow:hidden}
.sl .blob{position:absolute;border-radius:50%;background:var(--c);opacity:.13;animation:float 9s ease-in-out infinite alternate;pointer-events:none}
.sl .b1{width:420px;height:420px;left:-150px;top:-160px}
.sl .b2{width:260px;height:260px;left:120px;bottom:-150px;opacity:.08;animation-duration:12s}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(26px,18px)}}
.sl .tag{position:absolute;top:30px;right:100px;font-size:22px;font-weight:700;color:var(--c);display:flex;gap:10px;align-items:center}
.sl .tag::before{content:"";width:34px;height:4px;border-radius:4px;background:var(--c)}
.sl h2{font-size:72px;color:#0B3F50;margin:14px 0 6px;position:relative}
.sl .say{font-size:33px;color:#5A707A;position:relative;max-width:1300px}
.sl .body{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;margin-top:22px}
.a{animation:up .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 120ms + 120ms)}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.a.pop{animation-name:pop}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.a.sidein{animation-name:sidein}
@keyframes sidein{from{opacity:0;transform:translateX(-80px)}to{opacity:1;transform:none}}

.sl.cover{background:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--c) 70%,#035B73),#0B3F50 70%);color:#fff;justify-content:center;padding-left:720px}
.sl.cover.noimg{padding-left:100px}
.sl.cover .big{position:absolute;right:90px;top:20px;font-size:340px;font-weight:700;line-height:1;color:#fff;opacity:.07}
.sl.cover small{font-size:30px;color:#F5D9AE;font-weight:700;position:relative}
.sl.cover h1{font-size:104px;margin:10px 0 18px;position:relative}
.sl.cover p{font-size:40px;color:#D5E7EC;position:relative;max-width:900px}
.sl.cover .cimg{position:absolute;left:70px;top:50%;width:600px;height:600px;margin-top:-300px;border-radius:50%;background:#F6F2EA center/80% no-repeat;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop 1s both,float 8s 1s ease-in-out infinite alternate}
.sl.cover .cimg.robo{display:grid;place-items:center;background:radial-gradient(circle,rgba(245,217,174,.22) 0 55%,rgba(255,255,255,.06) 56% 70%,transparent 71%);box-shadow:none}
.sl.cover .cimg.robo .robot{width:440px;margin-top:40px}
.sl.cover .bubble{left:330px;top:46px;width:390px;font-size:32px;padding:18px 26px;min-height:90px}
.sl.cover .bubble::after{right:auto;left:60px}
.sl.end{background:linear-gradient(135deg,#0B3F50,color-mix(in srgb,var(--c) 75%,#0B3F50));color:#fff;justify-content:center;align-items:center;text-align:center}
.sl.end h1{font-size:96px;position:relative}
.sl.end p{font-size:42px;color:#D5E7EC;max-width:1150px;margin-top:20px;position:relative}
.sl.end .nx{font-size:34px;color:#F5D9AE;margin-top:40px;font-weight:700}

.hookq{font-size:84px;font-weight:700;color:var(--c);line-height:1.35;position:relative;padding-right:80px}
.hookq::before{content:"❝";position:absolute;right:0;top:-20px;font-size:110px;opacity:.3}
.hookp{font-size:40px;margin-top:26px;max-width:1250px}

.eq{display:flex;align-items:center;gap:22px;justify-content:center}
.eq .t{background:#fff;border-radius:30px;padding:26px 30px;text-align:center;min-width:300px;box-shadow:0 20px 40px -28px rgba(3,91,115,.6);border-bottom:10px solid var(--c)}
.eq .t b{display:block;font-size:56px;color:var(--c)}
.eq .t span{font-size:30px}
.eq .op{font-size:70px;color:#BC935A;font-weight:700}
.eq-res{margin:40px auto 0;font-size:44px;font-weight:700;background:#0B3F50;color:#fff;border-radius:999px;padding:12px 44px;width:fit-content}

.bricks{display:flex;flex-direction:column;gap:14px}
.brick{display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:center;border-radius:24px;padding:12px 30px;background:#fff;border-right:16px solid var(--k);box-shadow:0 14px 30px -24px rgba(3,91,115,.6)}
.brick b{font-size:50px;color:var(--k)}
.brick span{font-size:34px}
.brick em{font-style:normal;font-size:27px;color:#5A707A;display:block}

.vs{display:grid;grid-template-columns:1fr 90px 1fr;gap:10px;align-items:stretch}
.vs .mid{display:grid;place-items:center;font-size:44px;font-weight:700;color:#BC935A}
.side{background:#fff;border-radius:32px;padding:30px 36px;box-shadow:0 20px 44px -30px rgba(3,91,115,.6)}
.side.bad{border-top:14px solid #B04D45}.side.good{border-top:14px solid #2F8A55}.side.n1{border-top:14px solid #035B73}.side.n2{border-top:14px solid #BC935A}
.side h4{font-size:46px}
.side.bad h4{color:#B04D45}.side.good h4{color:#2F8A55}.side.n1 h4{color:#035B73}.side.n2 h4{color:#A87A35}
.side q{display:block;font-size:28px;color:#5A707A;margin:8px 0 6px;quotes:none;line-height:1.5}
.side ul{list-style:none;margin:10px 0 0;padding:0}
.side li{font-size:34px;padding:6px 0;display:grid;grid-template-columns:50px 1fr}
.side.bad li::before{content:"✕";color:#B04D45;font-weight:700}
.side.good li::before{content:"✓";color:#2F8A55;font-weight:700}
.side.n1 li::before,.side.n2 li::before{content:"●";font-size:.6em;padding-top:.5em}
.side.n1 li::before{color:#035B73}.side.n2 li::before{color:#BC935A}

.cards{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:22px}
.card{background:#fff;border-radius:30px;padding:28px 26px;box-shadow:0 20px 44px -30px rgba(3,91,115,.6);position:relative;overflow:hidden}
.card::after{content:"";position:absolute;left:-40px;bottom:-40px;width:120px;height:120px;border-radius:50%;background:var(--c);opacity:.1}
.card .ic{font-size:60px;line-height:1.1}
.card code{display:block;font-family:var(--mono);font-size:26px;color:#035B73;direction:ltr;text-align:right;margin-top:8px}
.card b{display:block;font-size:38px;line-height:1.3;margin-top:6px}
.card p{font-size:28px;color:#5A707A;line-height:1.5;margin-top:6px}
.card .why{display:block;margin-top:12px;font-size:26px;color:var(--c);font-weight:700;line-height:1.45}

.codewin{display:grid;grid-template-columns:1fr 470px;gap:40px;align-items:center}
.cw{background:#0F2A33;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.cw .bar{display:flex;gap:10px;align-items:center;padding:14px 22px;background:#0B222A;color:#9FC0C9;font-family:var(--mono);font-size:22px;direction:ltr}
.cw .bar i{width:13px;height:13px;border-radius:50%;background:#BC935A}
.cw .bar i:nth-child(2){background:#6CBBD0}.cw .bar i:nth-child(3){background:#5A707A}
.cw pre{margin:0;padding:26px 34px;color:#DDEBEE;font-family:var(--f);font-size:31px;line-height:1.65;white-space:pre-wrap;unicode-bidi:plaintext;text-align:start}
.cw pre .h{color:#F5D9AE;font-weight:700}
.note{background:#fff;border-radius:28px;padding:30px;font-size:33px;line-height:1.55;border-right:12px solid var(--c);box-shadow:0 20px 44px -30px rgba(3,91,115,.6)}
.note small{display:block;font-size:24px;color:var(--c);font-weight:700;margin-bottom:6px}

.flow{display:flex;align-items:stretch;justify-content:center}
.flow .nd{flex:1 1 0;min-width:0;background:#fff;border-radius:30px;padding:28px 18px;text-align:center;box-shadow:0 20px 44px -30px rgba(3,91,115,.6);border-top:10px solid var(--c)}
.nd .ic,.spk .ic{font-size:66px;line-height:1.1}
.nd b{display:block;font-size:36px;margin-top:8px;line-height:1.3}
.nd small{display:block;font-size:26px;color:#5A707A;line-height:1.45;margin-top:6px}
.flow .ar{flex:0 0 60px;display:grid;place-items:center;font-size:50px;color:var(--c);font-weight:700}
.loop{margin:34px auto 0;width:fit-content;font-size:32px;color:var(--c);font-weight:700;border:3px dashed var(--c);border-radius:999px;padding:6px 30px}

.tline{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:30px;padding-top:64px;position:relative}
.tline::before{content:"";position:absolute;top:28px;right:8%;left:8%;height:7px;border-radius:7px;background:linear-gradient(to left,#B04D45,var(--c));transform-origin:right;animation:grow 1.1s .2s both}
@keyframes grow{from{transform:scaleX(0)}}
.ti{position:relative;background:#fff;border-radius:30px;padding:28px 30px;box-shadow:0 20px 44px -30px rgba(3,91,115,.6)}
.ti::before{content:"";position:absolute;top:-52px;right:calc(50% - 18px);width:36px;height:36px;border-radius:50%;background:#fff;border:8px solid var(--c)}
.ti small{font-size:26px;color:#BC935A;font-weight:700}
.ti b{display:block;font-size:46px;line-height:1.3}
.ti p{font-size:30px;color:#5A707A}
.ti.old{opacity:.7}.ti.old b{text-decoration:line-through;text-decoration-color:#B04D45;text-decoration-thickness:5px}
.ti.now{outline:6px solid var(--c)}

.funnel{display:flex;flex-direction:column;align-items:center;gap:14px}
.fb{border-radius:22px;background:var(--c);color:#fff;text-align:center;padding:16px 30px;font-size:36px;font-weight:700;animation:fbin .8s both;animation-delay:calc(var(--i)*180ms + 150ms)}
@keyframes fbin{from{opacity:0;transform:scaleX(.3)}}
.fb:nth-child(even){filter:brightness(1.15)}
.fb:last-child{background:#BC935A}

.pick{display:flex;flex-direction:column;gap:14px}
.prow{display:grid;grid-template-columns:1fr 70px 1fr;gap:12px;align-items:center}
.prow button{font-family:inherit;text-align:right;font-size:34px;border:0;background:#fff;color:#142D36;border-radius:22px;padding:14px 26px;box-shadow:0 14px 30px -24px rgba(3,91,115,.6)}
.prow button:hover{outline:3px solid var(--c)}
.prow .ar{font-size:44px;color:var(--c);text-align:center;opacity:.2;transition:opacity .3s}
.prow .m{border-radius:22px;padding:14px 26px;background:var(--chip);color:transparent;font-size:34px;font-weight:700;transition:all .45s}
.prow .m small{display:block;font-size:24px;font-weight:400}
.prow.on .ar{opacity:1}
.prow.on .m{background:var(--c);color:#fff}
.prow.fixed button{font-family:var(--mono);direction:ltr;text-align:right;font-size:30px;cursor:default}

.hub{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px 40px;align-items:center}
.hubc{grid-area:2/2;width:300px;height:300px;margin:auto;border-radius:50%;background:var(--c);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 30px 60px -26px rgba(0,0,0,.5)}
.hubc .ic{font-size:80px;line-height:1.1}.hubc b{font-size:40px}
.spk{background:#fff;border-radius:26px;padding:18px 20px;text-align:center;box-shadow:0 20px 44px -30px rgba(3,91,115,.6)}
.spk .ic{font-size:50px}.spk b{display:block;font-size:34px}.spk small{display:block;font-size:24px;color:#5A707A}

.imgs{display:grid;grid-template-columns:1.25fr 1fr;gap:50px;align-items:center}
.imgs.tall{grid-template-columns:470px 1fr}
.imgs .ph{background:#fff;border-radius:30px;padding:22px;box-shadow:0 30px 60px -30px rgba(3,91,115,.7);transform:rotate(-1.2deg)}
.imgs .ph img{display:block;width:100%;max-height:560px;object-fit:contain;border-radius:16px}
.imgs.tall .ph img{max-height:600px}
.imgs .cap{font-size:22px;color:#5A707A;text-align:center;margin-top:8px}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
.pts li{font-size:36px;line-height:1.45;display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.pts li::before{content:"";width:22px;height:22px;border-radius:7px;background:var(--c);margin-top:18px;transform:rotate(45deg)}

.lv{display:flex;flex-direction:column;gap:18px}
.lv>div{display:grid;grid-template-columns:280px 1fr;align-items:stretch;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 20px 44px -30px rgba(3,91,115,.6)}
.lv b{background:var(--k);color:#fff;font-size:40px;padding:22px 20px;display:grid;place-items:center;text-align:center}
.lv span{font-size:36px;padding:20px 34px;align-self:center}

.sorts{display:flex;flex-direction:column;gap:16px}
.srow{background:#fff;border-radius:24px;padding:16px 26px;box-shadow:0 14px 30px -24px rgba(3,91,115,.6)}
.srow p{font-size:33px;font-weight:700}
.srow .bins{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.srow button{font-family:inherit;font-size:24px;border:2px solid rgba(20,45,54,.15);background:#F6F2EA;color:#142D36;border-radius:999px;padding:2px 20px}
.srow button.yes{background:#2F8A55;border-color:#2F8A55;color:#fff}
.srow button.no{background:#B04D45;border-color:#B04D45;color:#fff}
.srow .why{font-size:24px;color:#5A707A;margin-top:6px}

.sws{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.sw{background:#fff;border-radius:30px;overflow:hidden;text-align:center;padding-bottom:20px;box-shadow:0 20px 44px -30px rgba(3,91,115,.6)}
.sw i{display:block;height:300px}
.sw code{display:block;font-family:var(--mono);font-size:32px;margin-top:16px;direction:ltr}
.sw span{font-size:30px;color:#5A707A}

.vsw{display:grid;grid-template-columns:1fr 440px;gap:40px;align-items:center}
.vsc{display:grid;grid-template-columns:44px 230px 1fr 330px;grid-template-rows:38px 1fr 110px;height:560px;border-radius:18px;overflow:hidden;background:#1E1E1E;color:#D4D4D4;font-size:20px;direction:ltr;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.vs-tb{grid-column:1/-1;background:#323233;display:flex;gap:24px;align-items:center;padding:0 16px;font-size:16px;color:#aaa}
.vs-act{grid-row:2/4;background:#2C2C2C}
.vs-ex{grid-row:2/4;background:#252526;padding:6px 0}
.vs-h{font-size:14px;color:#BBB;padding:6px 14px;font-weight:700;position:relative}
.vs-h b{position:absolute;right:10px;top:2px;width:30px;height:30px;border-radius:50%;background:#BC935A;color:#fff;display:grid;place-items:center;font-size:17px;animation:pop .6s both;animation-delay:calc(var(--i)*300ms + 700ms)}
.vs-f{padding:2px 14px;font-family:var(--mono);font-size:16px;white-space:pre}
.vs-f.on{background:#37373D;color:#fff}
.vs-ed{overflow:hidden}
.vs-code{direction:rtl;text-align:right;padding:8px 20px;font-size:21px;line-height:1.7}
.vs-code .add{background:rgba(47,138,85,.35);color:#B8F0C8}
.vs-cl{grid-row:2/4;background:#252526;border-left:1px solid #333;padding:4px 10px;direction:rtl;text-align:right;display:flex;flex-direction:column;gap:10px}
.vs-cl .vs-h{direction:ltr;text-align:left}
.vs-me{background:#0A7896;color:#fff;border-radius:14px;padding:8px 12px;font-size:19px;line-height:1.5}
.vs-ai{background:#333;border-radius:14px;padding:8px 12px;font-size:19px;line-height:1.5}
.vs-bt{display:flex;gap:8px}.vs-bt span{border-radius:10px;padding:2px 14px;background:#444;font-size:18px}.vs-bt .y{background:#BC935A;color:#fff}
.vs-te{background:#181818;border-top:1px solid #333;padding:2px 14px;font-family:var(--mono);font-size:16px}
.vs-te .ok{color:#7FD99A}

.dev{display:grid;grid-template-columns:1fr 560px;gap:50px;align-items:center}
.brw{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(3,91,115,.7)}
.brw .bb{display:flex;gap:8px;align-items:center;padding:12px 18px;background:#E7EEF0}
.brw .bb i{width:12px;height:12px;border-radius:50%;background:#9FB2B8}
.brw .bb span{font-family:var(--mono);font-size:17px;color:#5A707A;margin-right:10px;direction:ltr}
.brw .bd{padding:22px 26px}
.brw h5{margin:0 0 14px;font-size:30px;color:#035B73}
.hb{display:grid;grid-template-columns:130px 1fr 54px;gap:12px;align-items:center;font-size:24px;margin-bottom:8px}
.hb i{display:block;height:22px;border-radius:8px;background:#035B73;transform-origin:right;animation:grow 1s both;animation-delay:calc(var(--i)*150ms + 400ms)}
.hb.g i{background:#BC935A}
.phone{width:400px;margin:0 auto;border:12px solid #142D36;border-radius:44px;background:#0E1621;padding:16px 14px;color:#E8EEF3;font-size:21px;line-height:1.55;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.phone .ph{text-align:center;font-weight:700;color:#8AB4F8;font-size:19px;margin-bottom:10px}
.bub{border-radius:16px;padding:8px 12px;margin-bottom:8px;max-width:90%}
.bub.me{background:#2B5278;margin-right:auto}
.bub.bot{background:#182533}
.kb{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 8px}
.kb span{background:#22364A;border-radius:10px;padding:5px;text-align:center;font-size:17px}
.kb span.w{grid-column:1/-1}

.sl.try{background:linear-gradient(160deg,#F6F2EA 50%,color-mix(in srgb,var(--c) 18%,#F6F2EA))}
.tryt{font-size:50px;line-height:1.5;max-width:1300px;font-weight:700}
.tbr{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
.tbr span{font-size:32px;font-weight:700;border-radius:999px;padding:6px 30px;border:3px solid var(--k);color:var(--k);background:#fff}
.trynote{font-size:30px;color:#5A707A;margin-top:36px}
.x.cls{width:34px;height:34px;border-radius:50%;background:rgba(20,45,54,.08);display:grid;place-items:center;font-size:17px;font-weight:700;z-index:2}
.x.cls:hover{background:#B04D45;color:#fff}
.fqb .x.cls,.alertb .x.cls{background:rgba(255,255,255,.2);color:#fff}
.alertb{padding-left:52px}
.pcard,.ccard{padding-left:56px}
/* ===== شريحة السؤال ===== */
.sl.qsl{background:radial-gradient(circle at 15% 85%,color-mix(in srgb,var(--c) 22%,#F6F2EA),#F6F2EA 55%);justify-content:center}
.qbadge{align-self:flex-start;background:var(--c);color:#fff;border-radius:999px;padding:6px 26px;font-size:28px;font-weight:700;position:relative}
.qtext{font-size:56px;font-weight:700;line-height:1.4;color:#0B3F50;margin-top:20px;max-width:1350px;position:relative}
.qopts{display:flex;flex-direction:column;gap:14px;margin-top:30px;position:relative}
.qo{display:grid;grid-template-columns:70px 1fr;gap:18px;align-items:center;text-align:right;font-family:inherit;font-size:34px;border:3px solid rgba(20,45,54,.12);background:#fff;color:#142D36;border-radius:24px;padding:12px 24px;cursor:pointer;box-shadow:0 14px 30px -24px rgba(3,91,115,.6)}
.qo i{font-style:normal;width:58px;height:58px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);display:grid;place-items:center;font-weight:700}
.qo.yes{border-color:#2F8A55;background:#E3F2E8}.qo.yes i{background:#2F8A55;color:#fff}
.qo.no{border-color:#B04D45;background:#F8E3E1}.qo.no i{background:#B04D45;color:#fff}
.qo:disabled{cursor:default}
.qwhy{font-size:30px;color:#2F8A55;margin-top:18px;font-weight:700;position:relative;min-height:1em}
.qlaunch{position:absolute;bottom:16px;right:16px;background:#fff;color:#142D36;border-radius:20px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:min(560px,92vw);box-shadow:0 24px 50px -20px rgba(0,0,0,.6)}
.qlaunch b{width:100%;font-size:15px}
.qlaunch .btn{font-size:16px;padding:6px 14px}
/* ===== شريحة القائمة ===== */
.lst{display:grid;grid-template-columns:1fr;gap:14px}
.lst.two{grid-template-columns:1fr 1fr;gap:12px 26px}
.lst .li{display:grid;grid-template-columns:70px 1fr;gap:20px;align-items:center;background:#fff;border-radius:24px;padding:14px 24px;box-shadow:0 14px 30px -24px rgba(3,91,115,.6)}
.lst .li>i{font-style:normal;width:62px;height:62px;border-radius:50%;background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);display:grid;place-items:center;font-size:32px;font-weight:700}
.lst .li b{display:block;font-size:34px;line-height:1.3;color:#0B3F50}
.lst .li span{font-size:30px;line-height:1.45}
.lst .li div span{font-size:27px;color:#5A707A}
.lst.two .li span{font-size:28px}
.lnote{margin-top:22px;background:#0B3F50;color:#fff;border-radius:22px;padding:16px 28px;font-size:30px;font-weight:700;line-height:1.5}
.card b:first-child{margin-top:0}
/* ===== الدخول ===== */
.who{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--chip);border-radius:999px;padding:3px 6px 3px 14px;font-size:16px;font-weight:700;color:var(--ink)}
.who small{background:var(--teal);color:var(--paper);border-radius:999px;padding:0 10px;font-size:13px}
.login{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px 24px}
.login>small{color:var(--gold);font-weight:700}
.lcards{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:760px;margin-top:14px}
.lcard{background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px}
.lcard i{font-style:normal;font-size:50px}
.lcard b{font-size:24px}
.lcard p{color:var(--muted);font-size:17px;flex:1}
@media (max-width:640px){.lcards{grid-template-columns:1fr}}
/* ===== الجلسة الحية ===== */
.ce{display:none!important}
body.can-edit .ce{display:inline-flex!important}
.slot{position:absolute;inset:0}
.sl.imgsl{padding:0;background:#000;display:grid;place-items:center}
.sl.imgsl img{width:100%;height:100%;object-fit:contain}
.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.ink.act{pointer-events:auto;cursor:crosshair;touch-action:none}
.ovl{position:absolute;inset:0 0 56px 0;pointer-events:none;z-index:20;font-family:var(--f)}
.ovl>*{pointer-events:auto}
.dbar{flex-wrap:wrap}
.dbar .tools{display:flex;gap:4px}
.dbar button.on{background:#BC935A;color:#fff}
.dbtn{position:relative}
.badge{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:#B04D45;color:#fff;font-size:12px;font-style:normal;display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
.sinfo{font-size:15px;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.1)}
.sinfo.warn{background:#B04D45}
.lostb.on{background:#B26A14!important;color:#fff}
.pcard,.ccard{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(680px,94vw);background:#fff;color:#142D36;border-radius:24px;padding:16px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.ccard{top:50%;bottom:auto;transform:translate(-50%,-50%);max-height:86%;overflow:auto}
.pcard small,.ccard small{font-weight:700;color:#BC935A;font-size:15px}
.pcard h3,.ccard h3{font-size:23px;margin:4px 0 12px;color:#0B3F50}
.popts{display:grid;gap:8px}
.popt{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right;font-family:inherit;font-size:19px;border:2px solid rgba(20,45,54,.14);background:#F6F2EA;color:#142D36;border-radius:14px;padding:10px 16px}
.popt span,.popt b{position:relative;z-index:1}
.popt i{position:absolute;top:0;bottom:0;right:0;background:rgba(43,122,153,.22);transition:width .6s}
.popt.sel{border-color:#2B7A99;background:#E3F0F5}
.popt.ok{border-color:#2F8A55;background:#E3F2E8}
.popt.bad{border-color:#B04D45;background:#F8E3E1}
.popt:disabled{cursor:default;color:#142D36}
.pnote{font-size:15px;color:#5A707A;margin-top:10px}
.chd{display:flex;justify-content:space-between;align-items:center}
.ctime{font-size:26px;color:#B04D45}
.cring{height:9px;border-radius:9px;background:#E7EEF0;margin:8px 0;position:relative;overflow:hidden}
.cring::after{content:"";position:absolute;top:0;bottom:0;right:0;width:calc(var(--p)*1%);background:linear-gradient(to left,#BC935A,#B04D45);transition:width 1s linear}
.board{margin-top:12px;background:#0B3F50;color:#fff;border-radius:16px;padding:12px 16px}
.board h4{color:#F5D9AE;font-size:18px;margin:0 0 6px}
.board ol{margin:0;padding-inline-start:24px}
.board li{font-size:17px}
.board li span{display:inline-block;min-width:60%}
.board li.me{color:#F5D9AE;font-weight:700}
.jcard{position:absolute;top:5%;bottom:5%;left:50%;transform:translateX(-50%);width:min(560px,92vw);background:#fff;color:#142D36;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;box-shadow:0 40px 80px -30px rgba(0,0,0,.7)}

 {t:"التنظيف وسجله",task:"اطلب تنظيف عينتك على نسخة مشتقة، مع سجل يفسر كل فرق.",model:"أنت مساعد في تنظيف البيانات. اترك raw_data كما هي، واعمل على نسخة في clean_data. شخّص أولاً: التكرار، وخارج الموضوع، والقيم الناقصة، وأخطاء الدراسة، بعدد كل نوع وثلاثة أمثلة. اعرض الخطة وانتظر موافقتي، ثم نفّذ وسجّل في cleaning_log.md لكل إجراء: العدد قبل وبعد، والسبب والمعيار، ونسخة الكود والتاريخ."},
 {t:"دليل التصنيف",task:"اطلب دليلاً من فئتين على الأقل، لكل فئة بطاقتها الخماسية.",model:"اكتب codebook.md: وحدة التحليل، والمحور، وفئتان على الأقل. لكل فئة: التعريف، والمؤشرات، ومثال حقيقي من بياناتي، ومثال مضاد، وقاعدة الحسم. ثم جرّبه على 20 وحدة، واعرض ما احتمل فئتين، وانتظر قراري."},
 {t:"التصنيف والثبات",task:"اطلب تصنيفاً بتعليل ودرجة ثقة، ثم ملفين لمصنّفين وحساب ألفا.",model:"صنّف الوحدات بدليل codebook.md وحده، ولا تبتكر فئات ولا تعدّل النص. لكل وحدة: الفئة، وتعليل قصير، ودليل نصي، ودرجة ثقة، و«تحتاج إلى مراجعة» عند الغموض. ثم جهّز 20 وحدة في ملفين لمصنّفين، وبعد تصنيفنا احسب ألفا كريبندورف واكتب reliability.md."},
 {t:"النتيجة والاستنتاج والتوصية",task:"اطلب أهم نتيجة بدرجاتها الثلاث، ومعها القيود.",model:"اكتب في findings.md أهم ثلاث نتائج. لكل منها: النتيجة بالعدد والنسبة والمقام، ثم الاستنتاج الذي تسمح به، ثم التوصية، ثم القيود والتفسيرات البديلة. لا تجعل الارتباط سببية، وما ثباته أقل من 0.80 يُوسم «نتيجة أولية»."}

 w.appendChild(el("b",null,S.myName||"حسابي"));w.appendChild(el("small",null,local.role==="trainer"?"مدرّب":"متدرب"));}

 p.appendChild(el("small",null,"تسجيل الدخول"));p.appendChild(el("h1",null,S.myName?"أهلاً، "+S.myName:"أهلاً بك"));

(async function(){
 if(!window.claude||!window.claude.use)return;
 user=await window.claude.use("user");db=await window.claude.use("db");
 if(user){try{uid=await user.id()}catch(e){}var can=null;try{can=await user.canEdit()}catch(e){}S.canEdit=can===true;if(can===false){$("roleBox").hidden=true;if(local.role==="trainer")setRole("trainee")}}
 document.body.classList.toggle("can-edit",S.canEdit);
 if(user&&uid){try{var me=await user.profiles([uid]);S.myName=(me&&me[uid]&&me[uid].name)||""}catch(e){}}drawWho();
 if(S.canEdit){try{S.assets=await window.claude.use("assets")}catch(e){S.assets=null}}
 if(!db){refreshPage();return}
 function sub(path,fn){db.doc(path).onSnapshot(function(s){fn(s.exists?JSON.parse(JSON.stringify(s.data()||{})):null)},function(){})}
 function subc(path,fn){db.collection(path).onSnapshot(function(q){fn(q.docs.map(function(d){var o=JSON.parse(JSON.stringify(d.data()||{}));o._id=d.id;return o}))},function(){})}
 if(uid){
  sub("wall/"+uid,function(d){if(d)myDoc=d});
  sub("stars/"+uid,function(d){myStars=d||{};DAYS.forEach(function(x){x.ex.forEach(function(y){if(y._set)y._set()})})});
  sub("resp/"+uid,function(d){S.myResp=d;renderLive()});
  sub("qs/"+uid,function(d){S.myQs=d;var b=document.querySelector(".myqs");if(b)renderMyQs(b)});
 }
 subc("wall",function(l){wallDocs=l;drawWall()});
 subc("stars",function(l){stars={};l.forEach(function(d){stars[d._id]=d});drawWall()});
 sub("live/now",function(d){live=d;drawLive()});
 if(local.role==="trainer"&&S.canEdit)subscribeTrainer(uid);else if(local.role==="trainer"){setRole("trainee")}
 if(local.role!=="trainer"&&local.joinTid)subscribeTrainer(local.joinTid);
 if(!local.role&&location.hash.indexOf("#/s/")!==0)location.hash="#/login";
 if(S.canEdit){subc("resp",function(l){S.resps=l;renderLive();if(location.hash.indexOf("studio")>-1)refreshPage()});subc("qs",function(l){S.qs=l;renderLive()})}
 refreshPage();
})();
})();
