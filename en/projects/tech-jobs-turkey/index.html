        <script>window.__PAGE__ = {"component":"portfolio/project","props":{"locale":"en","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"project":{"slug":"tech-jobs-turkey","title":"Demand for tech jobs in Turkey","tagline":"What do tech job ads ask of graduates?","tier":"story","kind":"DATA RESEARCH","context":"Final project of the course “Claude like a pro & research design”","year":"2026","status":null,"summary":"Research analysing 252 tech job ads in Turkey on LinkedIn: which job families and cities the demand comes from, what experience, education, language and tools are required, and how the language of the ads addresses applicants. It ends with a full analytical report and recommendations.","problem":"Students graduate with a degree, then meet ads that ask for experience, professional certificates, languages and specific tools, with no clear picture of what the market really asks for in each tech field.","solution":"LinkedIn ads were collected with twenty job titles in Turkish and English in four cities, cleaned with documented steps, coded automatically for 89 indicators in 14 axes, and 20 job descriptions were analysed qualitatively. The report separates findings, conclusions and recommendations.","role":"Shaping and refining the research question, collecting and cleaning the data, quantitative and qualitative analysis in Python, designing the figures and writing the report.","steps":[{"body":"263 LinkedIn ads in three batches, keeping only new ads in each batch.","title":"Collection"},{"body":"Eight steps documented in a log: removing reposts and freelance platforms, and flagging doubtful ads instead of deleting them. 252 ads remained.","title":"Cleaning"},{"body":"A guide of 14 axes and 89 indicators (education, programming languages, cloud, networking, certificates…) with keywords in Turkish and English.","title":"Quantitative coding"},{"body":"592 segments from 20 job descriptions coded with 26 codes in 6 themes, with a file for an inter-coder reliability test.","title":"Qualitative analysis"},{"body":"A report with eleven figures, a verdict on the hypothesis, a certainty level for each finding and recommendations with an implementation map.","title":"Report"}],"highlights":[{"label":"tech ads after cleaning","value":"252"},{"label":"indicators in the coding guide","value":"89"},{"label":"of ads reached 200 applicants","value":"79.7%"}],"challenges":["The research design changed twice, so each earlier design was archived instead of deleted, keeping every decision reviewable.","Honest certainty: the data is a one-week snapshot, so the hypothesis about seasonal demand stayed “not tested”, and results are labelled preliminary until the reliability test is complete.","Ads in two languages with overlapping titles: classification needed keyword lists in Turkish and English and rules for borderline cases."],"learned":"That good research separates findings, conclusions and recommendations, and that documenting every cleaning step and decision makes results trustworthy and reviewable.","tech":["Python","pandas","Apify","LinkedIn","matplotlib","Content analysis","Excel"],"github_url":null,"live_url":"/live/tech-jobs-tr/index.html","demo":"jobs"},"next":{"slug":"tech-jobs-bot","title":"Tech Jobs Bot","tagline":"Tech jobs in Turkey delivered to graduates every morning"}},"prefix":"/en","path":"/projects/tech-jobs-turkey/"};</script>
