act","year":"2026","status":null,"summary":"A demo charity platform with three sides: donors give in one tap, get an instant receipt and see where their money went; beneficiaries request aid with encrypted documents and track the status; and an administration for campaigns, donations, financial reports, volunteers and an audit log. In three languages (Arabic, English, Turkish) and in Turkish lira.","problem":"Donors rarely know where their gift went, charities manage campaigns, zakat, sadaqah and aid requests in scattered spreadsheets, and families’ sensitive documents (ID, medical reports) are sent in unsafe ways.","solution":"A Laravel REST API and a separate React app. Quick donate, a donation basket, regular giving and gifts on behalf of someone with a gift card, a zakat calculator, funds kept apart by type (zakat, sadaqah, sadaqah jariyah, kaffarah), a “where your money went” timeline fed by field updates, and badges plus a “tree of good” that grows with giving.","role":"A solo project built with an AI coding assistant: I defined the idea and requirements, chose the stack, and reviewed and tested the result. Payments are simulated (test cards) and the organisation is fictional — no real money is collected.","steps":[{"body":"Preset amounts, an impact slider that shows what the amount provides (“provides 2 food baskets”), live campaign progress, then a thank-you screen with confetti and sharing.","title":"One-tap giving"},{"body":"An instant printable digital receipt, a giving wallet with every receipt and regular donation, and a timeline from received to purchased to delivered.","title":"Receipt & tracking"},{"body":"Beneficiaries upload documents that are encrypted with AES-256 before they are stored, and follow their request: submitted, under review, approved, paid out.","title":"Safe aid requests"},{"body":"Campaigns in three languages, donations with CSV export, a financial report per fund, request review, volunteers and tasks, roles and permissions, and an audit log.","title":"Admin & reports"}],"highlights":[{"label":"Sides: donor, beneficiary, admin","value":"3"},{"label":"Encryption for documents and sensitive data","value":"AES-256"},{"label":"Automated tests for payments, encryption and permissions","value":"22"}],"challenges":["Zakat and kaffarah are restricted funds: every gift carries its type, each campaign accepts specific types, and the financial report shows money in and out per fund so nothing is spent outside its purpose.","Privacy: the card number is never stored (only brand and last 4 digits), beneficiaries’ documents are encrypted and open only to the owner and staff, and every view is logged.","Security: role-based permissions, two-factor authentication (TOTP) for staff, separate rate limits for sign-in attempts, and CSV exports protected from formula injection."],"learned":"Designing a product for several parties with different needs, and that trust in a charity platform is built with transparency: a receipt for every gift, updates from the field and a clear separation of funds.","tech":["Laravel 12","PHP","REST API","Sanctum","MySQL","React","TypeScript","Tailwind CSS","Framer Motion","Recharts"],"github_url":null,"live_url":"/live/bereket/","demo":"give"},"next":{"slug":"layoffs-data-cleaning","title":"Layoffs Data Cleaning","tagline":"From messy data to a table you can trust"}},"prefix":"/en","path":"/projects/bereket-charity/"};</script>
