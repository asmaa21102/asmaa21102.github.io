 wallet with every receipt and regular donation, and a timeline from received to purchased to delivered.","title":"Receipt & tracking"},{"body":"Beneficiaries upload documents that are encrypted with AES-256 before they are stored, and follow their request: submitted, under review, approved, paid out.","title":"Safe aid requests"},{"body":"Campaigns in three languages, donations with CSV export, a financial report per fund, request review, volunteers and tasks, roles and permissions, and an audit log.","title":"Admin & reports"}],"highlights":[{"label":"Sides: donor, beneficiary, admin","value":"3"},{"label":"Encryption for documents and sensitive data","value":"AES-256"},{"label":"Automated tests for payments, encryption and permissions","value":"22"}],"challenges":["Zakat and kaffarah are restricted funds: every gift carries its type, each campaign accepts specific types, and the financial report shows money in and out per fund so nothing is spent outside its purpose.","Privacy: the card number is never stored (only brand and last 4 digits), beneficiaries’ documents are encrypted and open only to the owner and staff, and every view is logged.","Security: role-based permissions, two-factor authentication (TOTP) for staff, separate rate limits for sign-in attempts, and CSV exports protected from formula injection."],"learned":"Designing a product for several parties with different needs, and that trust in a charity platform is built with transparency: a receipt for every gift, updates from the field and a clear separation of funds.","tech":["Laravel 12","PHP","REST API","Sanctum","MySQL","React","TypeScript","Tailwind CSS","Framer Motion","Recharts"],"github_url":null,"live_url":"/live/bereket/","demo":"give"},"next":{"slug":"layoffs-data-cleaning","title":"Layoffs Data Cleaning","tagline":"From messy data to a table you can trust"}},"prefix":"/en","path":"/projects/bereket-charity/"};</script>
