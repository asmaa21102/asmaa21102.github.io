        <script>window.__PAGE__ = {"component":"portfolio/project","props":{"locale":"en","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"project":{"slug":"smart-task","title":"Smart Task","tagline":"Plan your tasks and never miss a deadline","tier":"story","kind":"FULL-STACK · NODE.JS","context":"Web app · Node.js and MySQL","year":"2026","status":null,"summary":"A task manager with private accounts: every task has a date, time, priority, category and subtasks, with a browser notification before the deadline, daily, weekly or monthly repeats, and a stats panel with today’s progress and a day streak.","problem":"Tasks and appointments get scattered between notes and memory, and deadlines are missed. The first version of the app stored passwords as they were, anyone could delete other people’s tasks by changing a number in the request, and the database file was empty.","solution":"An Express server with secure sessions and bcrypt-hashed passwords, where every request checks the task belongs to its owner, and a MySQL database created automatically. The interface is plain JavaScript: tasks grouped (overdue, today, tomorrow, later), search and filters, a form with subtasks, and reminders with snooze.","role":"Designing the database, the API and the interface, moving from the first version to a fully secure one, and writing the tests.","steps":[{"body":"Sign-up and sign-in with a hashed password, a protected session, and a ready demo account.","title":"A private account"},{"body":"Date and time, low, medium or high priority, a coloured category and subtasks with a progress bar.","title":"A complete task"},{"body":"At the deadline or from 5 minutes up to a day before, as an in-page card and a browser notification, with “Done” and “Snooze 10 min”.","title":"A reminder on time"},{"body":"Completing a repeating task schedules the next one automatically, and a panel shows the completion rate, overdue tasks, the last 7 days and the streak.","title":"Repeats and stats"}],"highlights":[{"label":"automated tests for security, permissions and repeats","value":"8"},{"label":"languages: Arabic, English and Turkish","value":"3"},{"label":"access to another user’s tasks","value":"0"}],"challenges":["Permissions: every query is limited to the task owner, and a task that isn’t yours returns “not found”, so its existence isn’t revealed.","Local time: tasks are stored in the user’s time, so the browser sends its current time and “overdue” and “today” are computed correctly.","Monthly repeats: a task on the 31st moves to the last day of a short month instead of an invalid date.","Security: XSS protection by rendering text as text, CSRF protection with a custom header and a SameSite cookie, and a limit on sign-in attempts."],"learned":"That an app that “works” is not the same as a secure app, and that automated tests are what prove one user can’t reach another user’s data.","tech":["Node.js","Express","MySQL","bcrypt","express-session","JavaScript","Notifications API","node:test"],"github_url":null,"live_url":null,"demo":"tasks"},"next":{"slug":"smart-lab-analysis","title":"ATL Smart Lab Analysis","tagline":"From a confusing lab report to clear understanding"}},"prefix":"/en","path":"/projects/smart-task/"};</script>
