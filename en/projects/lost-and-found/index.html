status":null,"summary":"A web platform for reporting lost and found items with photos and a location, AI photo search, explained smart matching, private ownership verification and a full admin dashboard. Built for universities, schools, offices and public places.","problem":"When something is lost in a public place, information gets scattered across groups and messages, and whoever finds the item does not know how to reach its owner. The first version of the project matched on words only, had a basic interface and an open API without permissions.","solution":"Version 2 is one Node server with sessions and roles: a multi-photo report form with a map, browsing with filters and sorting, and photo search with a CLIP model running locally. Matching combines photo, words, category, colour, brand, place and date into a similarity score with reasons, followed by a private return request that the finder verifies (with an admin for valuable items).","role":"I built the first version (PHP + Express) myself: the interfaces, API, database and matching algorithm. Version 2 — the redesign, photo search, claims, admin dashboard and tests — was developed with an AI coding assistant.","steps":[{"body":"Up to 6 photos; the AI suggests category and colour from the photo; the place is picked on a map. Private details only the reporter sees.","title":"Report in a minute"},{"body":"Upload a picture and reports are ranked by visual similarity (CLIP via transformers.js, no API key).","title":"Search by photo"},{"body":"A 0–95 score with reasons: photo, category, words, colour, brand, distance and date — always a suggestion, never a confirmation.","title":"Matching that explains itself"},{"body":"Ownership request with private answers → review → approval → returned, with private messages, a history of every step and admin review of disputes.","title":"Safe return"}],"highlights":[{"label":"Local photo search and category/colour suggestions","value":"AI"},{"label":"Signals in the match score, each explained","value":"7"},{"label":"Automated tests for matching and user journeys","value":"22"}],"challenges":["Calibrating photo similarity: CLIP scores for different objects overlap with similar ones, so I measured them on the demo photos and show similarity as a label (very similar / similar) instead of a misleading percentage.","Privacy: the public map shows an approximate ~300 m area, photo location data is stripped, email and phone are never shown, and reports with numbers or links wait for review.","Protecting the API: role-based permissions, CSRF protection, rate limits, and checking the real image content instead of trusting the file extension."],"learned":"Using an AI model inside a real product honestly — as a suggestion people decide on — and designing a workflow with roles, permissions and an audit log.","tech":["Node.js","Express","MySQL","CLIP (transformers.js)","JavaScript","Leaflet","sharp","bcrypt"],"github_url":"https://github.com/asmaa21102/lost-found-project","live_url":"/live/lost-found/","demo":"match"},"next":{"slug":"bereket-charity","title":"Bereket — donation platform","tagline":"Give in one tap, and follow your gift until it arrives"}},"prefix":"/en","path":"/projects/lost-and-found/"};</script>
