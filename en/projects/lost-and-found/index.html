oto"},{"body":"A 0–95 score with reasons: photo, category, words, colour, brand, distance and date — always a suggestion, never a confirmation.","title":"Matching that explains itself"},{"body":"Ownership request with private answers → review → approval → returned, with private messages, a history of every step and admin review of disputes.","title":"Safe return"}],"highlights":[{"label":"Local photo search and category/colour suggestions","value":"AI"},{"label":"Signals in the match score, each explained","value":"7"},{"label":"Automated tests for matching and user journeys","value":"22"}],"challenges":["Calibrating photo similarity: CLIP scores for different objects overlap with similar ones, so I measured them on the demo photos and show similarity as a label (very similar / similar) instead of a misleading percentage.","Privacy: the public map shows an approximate ~300 m area, photo location data is stripped, email and phone are never shown, and reports with numbers or links wait for review.","Protecting the API: role-based permissions, CSRF protection, rate limits, and checking the real image content instead of trusting the file extension."],"learned":"Using an AI model inside a real product honestly — as a suggestion people decide on — and designing a workflow with roles, permissions and an audit log.","tech":["Node.js","Express","MySQL","CLIP (transformers.js)","JavaScript","Leaflet","sharp","bcrypt"],"github_url":"https://github.com/asmaa21102/lost-found-project","live_url":null,"demo":"match"},"next":{"slug":"bereket-charity","title":"Bereket — donation platform","tagline":"Give in one tap, and follow your gift until it arrives"}},"prefix":"/en","path":"/projects/lost-and-found/"};</script>
