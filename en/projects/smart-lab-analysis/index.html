        <script>window.__PAGE__ = {"component":"portfolio/project","props":{"locale":"en","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"project":{"slug":"smart-lab-analysis","title":"ATL Smart Lab Analysis","tagline":"From a confusing lab report to clear understanding","tier":"featured","kind":"CASE STUDY / HEALTH AI","context":"Graduation project · team of 3 · Karabük University","year":"2026","status":null,"summary":"A web system that analyzes lab reports in PDF: it extracts the medical values, compares each one with its normal range and explains it in plain language, then uses a Random Forest machine-learning model to estimate the likelihood of anemia.","problem":"Blood test reports are full of numbers and abbreviations, and most people cannot tell whether their results are normal until they see a doctor. The goal was to make the report understandable for non-specialists, with an early warning for signs of anemia.","solution":"A dashboard where the user uploads a report; the system extracts the values automatically, color-codes them against medical ranges, explains what each high or low value means and its possible causes, then shows the AI prediction and saves the analysis to the user history.","role":"I worked in a team of three students under academic supervision, building the system from the web interface and database to connecting the analysis service and the prediction model.","steps":[{"body":"The user signs in and drops a PDF into the dashboard.","title":"Upload the report"},{"body":"pdfplumber reads text reports, and pytesseract (OCR) handles scanned ones.","title":"Extract the values"},{"body":"Each value is compared with its normal range and labelled low, normal or high with clear colors.","title":"Compare with ranges"},{"body":"A Random Forest model takes sex, hemoglobin, MCH, MCHC and MCV and classifies: anemia or no
