        <script>window.__PAGE__ = {"component":"portfolio/home","props":{"locale":"en","appearance":{"accent":"#e9c46a","preset":"sand","primary":"#d4a373","bodyFont":"noto-kufi","secondary":"#2a9d8f","displayFont":"playfair"},"isAdmin":false,"flash":{"success":null},"projects":{"featured":[{"slug":"smart-lab-analysis","title":"ATL Smart Lab Analysis","tagline":"From a confusing lab report to clear understanding","tier":"featured","kind":"CASE STUDY / HEALTH AI","context":"Graduation project · team of 3 · Karabük University","year":"2026","status":null,"summary":"A web system that analyzes lab reports in PDF: it extracts the medical values, compares each one with its normal range and explains it in plain language, then uses a Random Forest machine-learning model to estimate the likelihood of anemia.","problem":"Blood test reports are full of numbers and abbreviations, and most people cannot tell whether their results are normal until they see a doctor. The goal was to make the report understandable for non-specialists, with an early warning for signs of anemia.","solution":"A dashboard where the user uploads a report; the system extracts the values automatically, color-codes them against medical ranges, explains what each high or low value means and its possible causes, then shows the AI prediction and saves the analysis to the user history.","role":"I worked in a team of three students under academic supervision, building the system from the web interface and database to connecting the analysis service and the prediction model.","steps":[{"body":"The user signs in and drops a PDF into the dashboard.","title":"Upload the report"},{"body":"pdfplumber reads text reports, and pytesseract (OCR) handles scanned ones.","title":"Extract the values"},{"body":"Each value is compared with its normal range and labelled low, normal or high with clear colors.","title":"Compare with ranges"},{"body":"A Random Forest model takes sex, hemoglobin, MCH, MCHC and MCV and classifies: anemia or not.","title":"AI prediction"},{"body":"A plain-language explanation for each value, advice to see a doctor when needed, and a saved history.","title":"Explain & save"}],"highlights":[{"label":"Random Forest accuracy on the test data","value":"98%"},{"label":"Markers used for the prediction","value":"5"},{"label":"Text and scanned reports","value":"PDF + OCR"}],"challenges":["Reports look different from one lab to another, so we needed two extraction paths: direct text reading, and OCR for scanned images.","Some reports miss values, so a SimpleImputer inside the pipeline keeps the model working when a value is absent.","Presenting a medical result responsibly: the system says the interpretation is preliminary and recommends seeing a doctor instead of giving a diagnosis."],"learned":"How to connect a machine-learning model to a real web application, and how to design an interface that explains complex data to a non-specialist.","tech":["Python","scikit-learn","pdfplumber","Tesseract OCR","PHP","MySQL","JavaScript","Node.js"],"github_url":"https://github.com/asmaa21102/smart-lab-analysis-project-","live_url":null,"demo":"lab"},{"slug":"lost-and-found","title":"Lost & Found","tagline":"Every lost item deserves a way back to its owner","tier":"featured","kind":"PRODUCT WALKTHROUGH","context":"Web platform · Full-stack · AI","year":"2026","status":null,"summary":"A web platform for reporting lost and found items with photos and a location, AI photo search, explained smart matching, private ownership verification and a full admin dashboard. Built for universities, schools, offices and public places.","problem":"When something is lost in a public place, information gets scattered across groups and messages, and whoever finds the item does not know how to reach its owner. The first version of the project matched on words only, had a basic interface and an open API without permissions.","solution":"Version 2 is one Node server with sessions and roles: a multi-photo report form with a map, browsing with filters and sorting, and photo search with a CLIP model running locally. Matching combines photo, words, category, colour, brand, place and date into a similarity score with reasons, followed by a private return request that the finder verifies (with an admin for valuable items).","role":"I built the first version (PHP + Express) myself: the interfaces, API, database and matching algorithm. Version 2 — the redesign, photo search, claims, admin dashboard and tests — was developed with an AI coding assistant.","steps":[{"body":"Up to 6 photos; the AI suggests category and colour from the photo; the place is picked on a map. Private details only the reporter sees.","title":"Report in a minute"},{"body":"Upload a picture and reports are ranked by visual similarity (CLIP via transformers.js, no API key).","title":"Search by photo"},{"body":"A 0–95 score with reasons: photo, category, words, colour, brand, distance and date — always a suggestion, never a confirmation.","title":"Matching that explains itself"},{"body":"Ownership request with private answers → review → approval → returned, with private messages, a history of every step and admin review of disputes.","title":"Safe return"}],"highlights":[{"label":"Local photo search and category/colour suggestions","value":"AI"},{"label":"Signals in the match score, each explained","value":"7"},{"label":"Automated tests for matching and user journeys","value":"22"}],"challenges":["Calibrating photo similarity: CLIP scores for different objects overlap with similar ones, so I measured them on the demo photos and show similarity as a label (very similar / similar) instead of a misleading percentage.","Privacy: the public map shows an approximate ~300 m area, photo location data is stripped, email and phone are never shown, and reports with numbers or links wait for review.","Protecting the API: role-based permissions, CSRF protection, rate limits, and checking the real image content instead of trusting the file extension."],"learned":"Using an AI model inside a real product honestly — as a suggestion people decide on — and designing a workflow with roles, permissions and an audit log.","tech":["Node.js","Express","MySQL","CLIP (transformers.js)","JavaScript","Leaflet","sharp","bcrypt"],"github_url":"https://github.com/asmaa21102/lost-found-project","live_url":null,"demo":"match"},{"slug":"bereket-charity","title":"Bereket — donation platform","tagline":"Give in one tap, and follow your gift until it arrives","tier":"featured","kind":"FULL-STACK PRODUCT","context":"Web app · Laravel API + React","year":"2026","status":null,"summary":"A demo charity platform with three sides: donors give in one tap, get an instant receipt and see where their money went; beneficiaries request aid with encrypted documents and track the status; and an administration for campaigns, donations, financial reports, volunteers and an audit log. In three languages (Arabic, English, Turkish) and in Turkish lira.","problem":"Donors rarely know where their gift went, charities manage campaigns, zakat, sadaqah and aid requests in scattered spreadsheets, and families’ sensitive documents (ID, medical reports) are sent in unsafe ways.","solution":"A Laravel REST API and a separate React app. Quick donate, a donation basket, regular giving and gifts on behalf of someone with a gift card, a zakat calculator, funds kept apart by type (zakat, sadaqah, sadaqah jariyah, kaffarah), a “where your money went” timeline fed by field updates, and badges plus a “tree of good” that grows with giving.","role":"A solo project built with an AI coding assistant: I defined the idea and requirements, chose the stack, and reviewed and tested the result. Payments are simulated (test cards) and the organisation is fictional — no real money is collected.","steps":[{"body":"Preset amounts, an impact slider that shows what the amount provides (“provides 2 food baskets”), live campaign progress, then a thank-you screen with confetti and sharing.","title":"One-tap giving"},{"body":"An instant printable digital receipt, a giving wallet with every receipt and regular donation, and a timeline from received to purchased to delivered.","title":"Receipt & tracking"},{"body":"Beneficiaries upload documents that are encrypted with AES-256 before they are stored, and follow their request: submitted, under review, approved, paid out.","title":"Safe aid requests"},{"body":"Campaigns in three languages, donations with CSV export, a financial report per fund, request review, volunteers and tasks, roles and permissions, and an audit log.","title":"Admin & reports"}],"highlights":[{"label":"Sides: donor, beneficiary, admin","value":"3"},{"label":"Encryption for documents and sensitive data","value":"AES-256"},{"label":"Automated tests for payments, encryption and permissions","value":"22"}],"challenges":["Zakat and kaffarah are restricted funds: every gift carries its type, each campaign accepts specific types, and the financial report shows money in and out per fund so nothing is spent outside its purpose.","Privacy: the card number is never stored (only brand and last 4 digits), beneficiaries’ documents are encrypted and open only to the owner and staff, and every view is logged.","Security: role-based permissions, two-factor authentication (TOTP) for staff, separate rate limits for sign-in attempts, and CSV exports protected from formula injection."],"learned":"Designing a product for several parties with different needs, and that trust in a charity platform is built with transparency: a receipt for every gift, updates from the field and a clear separation of funds.","tech":["Laravel 12","PHP","REST API","Sanctum","MySQL","React","TypeScript","Tailwind CSS","Framer Motion","Recharts"],"github_url":null,"live_url":null,"demo":"give"}],"story":[{"slug":"layoffs-data-cleaning","title":"Layoffs Data Cleaning","tagline":"From messy data to a table you can trust","tier":"story","kind":"DATA STORYTELLING","context":"Data analysis · MySQL","year":"2026","status":null,"summary":"Cleaning a dataset of tech layoffs around the world (over 2,300 records) with SQL only, step by step, until it is ready for analysis.","problem":"The raw data had duplicate rows, inconsistent names (Crypto vs. CryptoCurrency), countries with a trailing dot, dates stored as text and blank values. Any analysis on it would give wrong numbers.","solution":"Working on a staging copy to protect the original data, then four cleaning stages documented in separate SQL files.","role":"A solo project to practise SQL and data cleaning.","steps":[{"body":"ROW_NUMBER() OVER (PARTITION BY ...) inside a CTE to find duplicate rows and delete them.","title":"Remove duplicates"},{"body":"TRIM company names, unify everything starting with Crypto, and remove the trailing dot from country names.","title":"Standardize values"},{"body":"STR_TO_DATE to convert text into dates, then change the column type to DATE.","title":"Fix dates"},{"body":"Turn empty values into NULL, then fill the missing industry from other rows of the same company using a self join.","title":"Handle blanks"}],"highlights":[{"label":"Records in the raw data","value":"2,361"},{"label":"Documented cleaning stages","value":"4"},{"label":"SQL, no external tools","value":"100%"}],"challenges":["There is no unique ID column, so a duplicate had to be defined by a whole set of columns.","Filling missing values without guessing: only from other records of the same company in the same city."],"learned":"Good analysis starts with good data, and documenting every step makes the work reviewable.","tech":["MySQL","SQL","CTE","Window Functions","Data Cleaning"],"github_url":"https://github.com/asmaa21102/Data-Cleaning-MySQL","live_url":null,"demo":"data"},{"slug":"tech-jobs-turkey","title":"Demand for tech jobs in Turkey","tagline":"What do tech job ads ask of graduates?","tier":"story","kind":"DATA RESEARCH","context":"Final project of the course “Claude like a pro & research design”","year":"2026","status":null,"summary":"Research analysing 252 tech job ads in Turkey on LinkedIn: which job families and cities the demand comes from, what experience, education, language and tools are required, and how the language of the ads addresses applicants. It ends with a full analytical report and recommendations.","problem":"Students graduate with a degree, then meet ads that ask for experience, professional certificates, languages and specific tools, with no clear picture of what the market really asks for in each tech field.","solution":"LinkedIn ads were collected with twenty job titles in Turkish and English in four cities, cleaned with documented steps, coded automatically for 89 indicators in 14 axes, and 20 job descriptions were analysed qualitatively. The report separates findings, conclusions and recommendations.","role":"Shaping and refining the research question, collecting and cleaning the data, quantitative and qualitative analysis in Python, designing the figures and writing the report.","steps":[{"body":"263 LinkedIn ads in three batches, keeping only new ads in each batch.","title":"Collection"},{"body":"Eight steps documented in a log: removing reposts and freelance platforms, and flagging doubtful ads instead of deleting them. 252 ads remained.","title":"Cleaning"},{"body":"A guide of 14 axes and 89 indicators (education, programming languages, cloud, networking, certificates…) with keywords in Turkish and English.","title":"Quantitative coding"},{"body":"592 segments from 20 job descriptions coded with 26 codes in 6 themes, with a file for an inter-coder reliability test.","title":"Qualitative analysis"},{"body":"A report with eleven figures, a verdict on the hypothesis, a certainty level for each finding and recommendations with an implementation map.","title":"Report"}],"highlights":[{"label":"tech ads after cleaning","value":"252"},{"label":"indicators in the coding guide","value":"89"},{"label":"of ads reached 200 applicants","value":"79.7%"}],"challenges":["The research design changed twice, so each earlier design was archived instead of deleted, keeping every decision reviewable.","Honest certainty: the data is a one-week snapshot, so the hypothesis about seasonal demand stayed “not tested”, and results are labelled preliminary until the reliability test is complete.","Ads in two languages with overlapping titles: classification needed keyword lists in Turkish and English and rules for borderline cases."],"learned":"That good research separates findings, conclusions and recommendations, and that documenting every cleaning step and decision makes results trustworthy and reviewable.","tech":["Python","pandas","Apify","LinkedIn","matplotlib","Content analysis","Excel"],"github_url":null,"live_url":"/live/tech-jobs-tr/index.html","demo":"jobs"},{"slug":"tech-jobs-bot","title":"Tech Jobs Bot","tagline":"Tech jobs in Turkey delivered to graduates every morning","tier":"story","kind":"TELEGRAM BOT · PYTHON","context":"Telegram bot · part of the course final project","year":"2026","status":null,"summary":"A Telegram bot that collects tech jobs in Turkey every morning from free sources, cleans them with the same steps as the research and delivers them to graduates by field, city and level, with saving, sharing, a morning digest and job posting for companies.","problem":"Once the research showed what the ads ask for, the ads themselves still sat in a spreadsheet, far from the graduates who need them.","solution":"A bot built with python-telegram-bot and SQLite: automatic collection at 8:30 from two public Telegram channels and the Remotive API, seven cleaning steps and automatic classification, then a 9:00 digest for each user with what matches their preferences and hasn’t been seen yet.","role":"Designing the bot and writing the collector, the cleaning and the database, the user experience (a welcome with voice and video, and the research report inside the chat), and preparing deployment on a free server.","steps":[{"body":"“Python Istanbul Junior” and the bot understands field, city and level, widening the search step by step if nothing matches.","title":"One-line search"},{"body":"A card per job in one message with navigation and apply buttons, a saved list, and one-tap sharing.","title":"Browse and save"},{"body":"Preferences are set once, then only the new matching jobs arrive each morning.","title":"Morning digest"},{"body":"An 8-step posting form inside the bot, checked for duplicates before publishing.","title":"For companies"}],"highlights":[{"label":"tech jobs in the database","value":"256"},{"label":"cleaning steps per batch","value":"7"},{"label":"daily digest by preferences","value":"9:00"}],"challenges":["Free sources are poor in tech jobs: of 64 unique posts in the two Arabic channels only one tech ad remained, and this was recorded as a lesson instead of inflating the numbers.","Protecting the key: the bot token is read from a .env file and never printed, and even library logs that could show the URL were silenced.","Always on: a systemd unit and instructions for a free server, so the digest arrives on time even when the computer is off."],"learned":"Turning research results into a service people use, and that source quality matters more than the number of sources.","tech":["Python","python-telegram-bot","SQLite","BeautifulSoup","edge-tts","systemd"],"github_url":null,"live_url":"/live/job-bot/index.html","demo":"bot"},{"slug":"researcher-with-claude","title":"The AI Trainer","tagline":"An AI-powered training platform: from a question in your head to a report and a bot","tier":"story","kind":"INTERACTIVE COURSE APP","context":"Platform for a course on research with AI · for the trainer and trainees","year":"2026","status":null,"summary":"A web app for a five-day course on research with AI: 113 animated slides, exercises trainees write for their own project, “questions for the room” answered from phones, and two modes: the trainer runs the live session, trainees follow, submit and see their results.","problem":"A hands-on course needs more than a slide file: the trainer needs to see what trainees write and ask questions in real time, and trainees need one place for the slides, the exercises and their project.","solution":"One page with roles: a home page with the five-day map, a page per day with its slides and exercises, a room board showing what trainees submit, and a live session the room joins with a code or QR, with questions, polls, a timed quiz with a leaderboard and drawing on the slide.","role":"Designing the app, writing its content and building it with trainer and trainee modes, using real examples and numbers from the project “Demand for tech jobs in Turkey”.","steps":[{"body":"Working with an AI assistant, memory files and the research question; then data sources and scraping; then cleaning, reliability and analysis; then reports and reels; then a Telegram bot and a web page.","title":"Five days"},{"body":"113 animated slides: comparisons, question-narrowing ladders, sorting exercises and questions the audience answers.","title":"Interactive slides"},{"body":"Four exercises a day that trainees write for their own project, with a meter showing which parts of a professional prompt are present, and a model answer.","title":"Project exercises"},{"body":"A code and QR to join, questions, polls and a timed quiz, trainees’ questions for the trainer, and a room board where the best answers get a star.","title":"Live session"}],"highlights":[{"label":"training days in one app","value":"5"},{"label":"interactive slides","value":"113"},{"label":"modes: trainer and trainee","value":"2"}],"challenges":["Permissions: what a trainee writes is seen by them and the trainer, the room board is shown to everyone, and only the trainer controls the session.","Presenting on any screen: slides are a fixed 1600×900 stage scaled to fill the screen, with full screen and arrow-key navigation.","Real examples, not made-up ones: the numbers on the slides come from the project data and report, labelled as preliminary results."],"learned":"Turning a training curriculum into an interactive product, and designing an experience that changes by role while protecting each user’s data.","tech":["HTML","CSS","JavaScript","SVG animation","Claude Artifacts","pdf.js","QR"],"github_url":null,"live_url":"https://claude.ai/artifact/534gxBN5QF1zx1zWT9Cj8c","demo":"course"},{"slug":"smart-task","title":"Smart Task","tagline":"Plan your tasks and never miss a deadline","tier":"story","kind":"FULL-STACK · NODE.JS","context":"Web app · Node.js and MySQL","year":"2026","status":null,"summary":"A task manager with private accounts: every task has a date, time, priority, category and subtasks, with a browser notification before the deadline, daily, weekly or monthly repeats, and a stats panel with today’s progress and a day streak.","problem":"Tasks and appointments get scattered between notes and memory, and deadlines are missed. The first version of the app stored passwords as they were, anyone could delete other people’s tasks by changing a number in the request, and the database file was empty.","solution":"An Express server with secure sessions and bcrypt-hashed passwords, where every request checks the task belongs to its owner, and a MySQL database created automatically. The interface is plain JavaScript: tasks grouped (overdue, today, tomorrow, later), search and filters, a form with subtasks, and reminders with snooze.","role":"Designing the database, the API and the interface, moving from the first version to a fully secure one, and writing the tests.","steps":[{"body":"Sign-up and sign-in with a hashed password, a protected session, and a ready demo account.","title":"A private account"},{"body":"Date and time, low, medium or high priority, a coloured category and subtasks with a progress bar.","title":"A complete task"},{"body":"At the deadline or from 5 minutes up to a day before, as an in-page card and a browser notification, with “Done” and “Snooze 10 min”.","title":"A reminder on time"},{"body":"Completing a repeating task schedules the next one automatically, and a panel shows the completion rate, overdue tasks, the last 7 days and the streak.","title":"Repeats and stats"}],"highlights":[{"label":"automated tests for security, permissions and repeats","value":"8"},{"label":"languages: Arabic, English and Turkish","value":"3"},{"label":"access to another user’s tasks","value":"0"}],"challenges":["Permissions: every query is limited to the task owner, and a task that isn’t yours returns “not found”, so its existence isn’t revealed.","Local time: tasks are stored in the user’s time, so the browser sends its current time and “overdue” and “today” are computed correctly.","Monthly repeats: a task on the 31st moves to the last day of a short month instead of an invalid date.","Security: XSS protection by rendering text as text, CSRF protection with a custom header and a SameSite cookie, and a limit on sign-in attempts."],"learned":"That an app that “works” is not the same as a secure app, and that automated tests are what prove one user can’t reach another user’s data.","tech":["Node.js","Express","MySQL","bcrypt","express-session","JavaScript","Notifications API","node:test"],"github_url":null,"live_url":null,"demo":"tasks"}],"lab":[{"slug":"asmaa-giyim","title":"Asmaa Giyim","tagline":"Clothing store mobile app","tier":"lab","kind":"FLUTTER · INTERNSHIP","context":"Internship at MGS Software","year":"2025 · 2026","status":null,"summary":"A Flutter clothing store: a home page with search and deals, six categories, a product page with sizes and quantity, favourites, and a cart saved on the device with a free-shipping meter and a demo checkout. Built with Material 3.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Flutter","Dart","Material 3","shared_preferences"],"github_url":"https://github.com/asmaa21102/son-staj-proji","live_url":"/live/phone.html?app=asmaa-giyim&title=Asmaa%20Giyim","demo":null},{"slug":"canta-magazasi","title":"Çanta Mağazası","tagline":"Bag store web front end","tier":"lab","kind":"WEB · FRONT-END","context":"Web project","year":"2025 · 2026","status":null,"summary":"A bag store in plain HTML, CSS and JavaScript: instant search, categories, a price filter and sorting, quick view, favourites, a cart saved in the browser and a demo checkout with form validation. Three languages, dark mode and mobile-friendly.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["HTML","CSS","JavaScript","localStorage"],"github_url":null,"live_url":"/live/canta-magazasi/index.html","demo":null},{"slug":"xo-flutter","title":"XO Tic Tac Toe","tagline":"Tic Tac Toe for mobile","tier":"lab","kind":"FLUTTER · GAME","context":"Learning project","year":"2025 · 2026","status":null,"summary":"A Flutter Tic Tac Toe: play a friend or the computer at three levels (hard uses Minimax and never loses), a saved scoreboard and an animated winning line. The game logic is separate and unit-tested.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Flutter","Dart","Minimax","Unit tests"],"github_url":"https://github.com/asmaa21102/tec-oyun","live_url":"/live/phone.html?app=xo-flutter&title=XO%20Tic%20Tac%20Toe","demo":null},{"slug":"sinav-quiz","title":"Sınav","tagline":"True or false quiz","tier":"lab","kind":"FLUTTER · QUIZ","context":"Learning project","year":"2025 · 2026","status":null,"summary":"A Flutter true/false quiz in four topics (Flutter, Dart, web and general programming): a 15-second timer per question, an explanation after each answer, answer streaks, a results screen with a review and a saved best score.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Flutter","Dart","Animations","shared_preferences"],"github_url":"https://github.com/asmaa21102/sinav","live_url":"/live/phone.html?app=sinav-quiz&title=S%C4%B1nav","demo":null},{"slug":"turkce-sarkilar","title":"Türkçe Şarkılar","tagline":"Music player with Turkish makams","tier":"lab","kind":"FLUTTER · AUDIO","context":"Learning project","year":"2025 · 2026","status":null,"summary":"A Flutter music player: a library of 12 tracks to pick from, with search, makam filters, sorting, favourites and recently played, a mini player at the bottom and a full now-playing screen with an up-next list, repeat, shuffle and a seekable progress bar. The tracks are original demo tunes generated inside the app (a plucked-string sound in Hicaz, Uşşak, Rast and other makams with a darbuka rhythm), with no copyrighted songs.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Flutter","Dart","audioplayers","Audio synthesis"],"github_url":"https://github.com/asmaa21102/music","live_url":"/live/phone.html?app=turkce-sarkilar&title=T%C3%BCrk%C3%A7e%20%C5%9Eark%C4%B1lar","demo":null},{"slug":"socket-tic-tac-toe","title":"Network Tic Tac Toe","tagline":"Two-player game over the network","tier":"lab","kind":"PYTHON · C · SOCKETS","context":"University project","year":"2024 · 2026","status":null,"summary":"Tic Tac Toe between two players over the network, with a Python server as the referee: it keeps the board, decides whose turn it is and rejects invalid moves. The first version ran in the terminal with sockets and threads; the current one is online over WebSocket, with rooms shared by link, a score, rematches and emoji reactions.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Python","asyncio","WebSocket","Sockets","JavaScript"],"github_url":"https://github.com/asmaa21102/tec-tac-toc","live_url":null,"demo":null},{"slug":"js-clock","title":"JS Clock","tagline":"Clock, world clocks, stopwatch and timer","tier":"lab","kind":"JAVASCRIPT","context":"Small experiment","year":"2025 · 2026","status":null,"summary":"A clock app in plain JavaScript: an analog and digital clock in 12- or 24-hour format, world clocks with time differences, a stopwatch with laps that marks the fastest and slowest, and a timer with a progress ring and a sound alert. Three languages, light and dark mode.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["HTML","CSS","JavaScript","Intl API","Web Audio"],"github_url":"https://github.com/asmaa21102/js-clock","live_url":"/live/js-clock/index.html","demo":null},{"slug":"excel-bike-sales","title":"Bike Sales Dashboard","tagline":"Who buys a bike? An interactive Excel dashboard","tier":"lab","kind":"EXCEL · DATA ANALYSIS","context":"Learning project · Data analysis","year":"2026","status":null,"summary":"Cleaning data on 1,000 customers in Excel (standardising values and grouping ages into brackets), then analysing it with 12 pivot tables and 13 charts: average income by gender and purchase, and purchases by commute distance and age bracket, in a dashboard with slicers for marital status, education and region.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Excel","Pivot Tables","Pivot Charts","Slicers","Data Cleaning"],"github_url":null,"live_url":"/live/data-dashboards/index.html","demo":null},{"slug":"powerbi-data-survey","title":"Data Professionals Survey","tagline":"A Power BI dashboard for a survey of 630 data professionals","tier":"lab","kind":"POWER BI · DASHBOARD","context":"Learning project · Data analysis","year":"2026","status":null,"summary":"Cleaning survey answers in Power Query (unifying “Other” answers and turning salary ranges into their midpoint), then a 7-visual dashboard: average salary by title and gender, favourite programming language by title, countries, and a gauge for work/life balance satisfaction.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Power BI","Power Query","DAX","Data Visualization"],"github_url":null,"live_url":"/live/data-dashboards/index.html?tab=pbi","demo":null}],"idea":[{"slug":"this-portfolio","title":"This website","tagline":"Interactive portfolio","tier":"idea","kind":"LARAVEL · REACT","context":null,"year":"2026","status":"In progress","summary":"The site you are browsing: Laravel, Inertia, React and Tailwind, with a MySQL database to add projects easily.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Laravel","Inertia","React","Tailwind","MySQL"],"github_url":null,"live_url":null,"demo":null},{"slug":"smart-lab-next","title":"Smart Lab — next step","tagline":"Extending prediction to other markers","tier":"idea","kind":"HEALTH AI","context":null,"year":"2026","status":"Idea","summary":"Adding models for other health markers such as diabetes, and supporting more lab report layouts.","problem":null,"solution":null,"role":null,"steps":null,"highlights":null,"challenges":null,"learned":null,"tech":["Python","scikit-learn"],"github_url":null,"live_url":null,"demo":null}]}},"prefix":"/en","path":"/"};</script>
